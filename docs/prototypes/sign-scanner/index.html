<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ParQueen · Sign Scanner · Phase 1 prototype</title>
<!--
  PHASE 1 DESIGN PROTOTYPE. Not production code, not imported by the app, not part of the Vite build.
  Camera capture and analyzeSign responses are mocked. Colour tokens are copied from index.css
  (:root / .dark) so the prototype renders with the shipping palette.
  Query params: vp=s20|p390|se  state=<state key>  theme=dark|light  motion=auto|reduce  text=1|1.15|1.3  clean=1
-->
<style>
/* ── ParQueen tokens (copied from index.css) ─────────────────────────────── */
:root {
  --color-bg: #F7FAFC; --color-surface: #FFFFFF; --color-text: #0C2238;
  --color-text-secondary: rgba(12, 34, 56, 0.66); --color-border: rgba(12, 34, 56, 0.12);
  --color-brand: #0b63e6; --color-brand-2: #0a75a6; --color-info: #0b6aa8;
  --color-success: #046b4e; --color-danger: #bf2424; --color-warning: #9a4d05;
  --mobile-shell-focus: #3d8fff;
  /* scanner-scoped (light) */
  --ss-text-2: #2f4762; --ss-text-3: #4d6178;
  --ss-surface: #ffffff; --ss-surface-2: #eef3f9; --ss-border: rgba(12, 34, 56, 0.12);
  --ss-accent: #0b6aa8;
  --ss-ok-bg: rgba(4, 107, 78, 0.10); --ss-bad-bg: rgba(191, 36, 36, 0.09); --ss-warn-bg: rgba(154, 77, 5, 0.10);
}
.dark {
  --color-bg: #050d1c; --color-surface: #091728; --color-text: #ffffff;
  --color-text-secondary: rgba(255, 255, 255, 0.55); --color-border: rgba(255, 255, 255, 0.1);
  --color-info: #38bdf8; --color-success: #34d399; --color-danger: #f87171; --color-warning: #fbbf24;
  --mobile-shell-focus: #82bdff;
  --ss-text-2: #c4d3e6; --ss-text-3: #9fb3cc;
  --ss-surface: #0b1930; --ss-surface-2: #0f2140; --ss-border: rgba(255, 255, 255, 0.10);
  --ss-accent: #67ddfc;
  --ss-ok-bg: rgba(52, 211, 153, 0.12); --ss-bad-bg: rgba(248, 113, 113, 0.12); --ss-warn-bg: rgba(251, 191, 36, 0.12);
}

/* ── Prototype chrome (not part of the design) ───────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #0a0e15; color: #d6dfeb; min-height: 100vh;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.pc { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; padding: 14px 18px 12px; border-bottom: 1px solid #1c2433; font-size: 12px; }
.pc-brand { flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.pc-brand b { font-size: 15px; color: #fff; }
.pc-brand span { color: #8592a6; }
.pc label { display: flex; flex-direction: column; gap: 4px; color: #8592a6; font-weight: 600; letter-spacing: .02em; }
.pc select { font: inherit; font-size: 13px; color: #e8eef7; background: #121925; border: 1px solid #263044; border-radius: 8px; padding: 7px 8px; min-width: 132px; }
.pm { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 28px; padding: 22px 18px 48px; }
.notes { width: 300px; font-size: 13px; line-height: 1.5; color: #b8c4d4; }
.notes h3 { margin: 0 0 6px; font-size: 14px; color: #fff; }
.notes .k { display: inline-block; margin: 10px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6f7d92; }
.notes ul { margin: 0; padding-left: 16px; }
.notes li { margin: 3px 0; }
.notes code { font-size: 12px; color: #9fd8ef; }

.device {
  --sat: 28px; --sab: 16px;
  position: relative; flex: none; width: 360px; height: 800px; overflow: hidden; border-radius: 30px;
  box-shadow: 0 0 0 9px #141a25, 0 0 0 10px #2a3346, 0 28px 70px rgba(0, 0, 0, .55);
  container-type: size; container-name: device;
}
.sbar { position: absolute; z-index: 20; inset: 0 0 auto; height: var(--sat); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; font-weight: 600; color: var(--color-text); pointer-events: none; }
.sbar svg { display: block; }
.device.on-camera .sbar { color: #fff; }
.gbar { position: absolute; z-index: 20; left: 50%; bottom: calc(var(--sab) / 2 - 2px); width: 108px; height: 4px; margin-left: -54px; border-radius: 2px; background: var(--color-text); opacity: .45; pointer-events: none; }
.device.on-camera .gbar { background: #fff; }
body.clean { background: var(--color-bg); }
body.clean .pc, body.clean .notes { display: none; }
body.clean .pm { padding: 0; }
body.clean .device { position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; border-radius: 0; box-shadow: none; }

/* ── Sign Scanner screen (the design) ───────────────────────────────────── */
.pq-ss {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  background: var(--color-bg); color: var(--color-text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
.pq-ss button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pq-ss :focus-visible { outline: 2px solid var(--mobile-shell-focus); outline-offset: 2px; }
.pq-ss [tabindex="-1"]:focus { outline: none; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* header */
.ss-head { flex: none; display: flex; align-items: center; gap: .75rem; padding: calc(var(--sat) + .5rem) 1rem .5rem; background: var(--color-bg); position: relative; z-index: 2; }
.ss-back { width: 2.75rem; height: 2.75rem; flex: none; display: grid; place-items: center; border-radius: 999px; background: var(--ss-surface); border: 1px solid var(--ss-border); }
.ss-back .ic { width: 1.25rem; height: 1.25rem; }
.ss-back:active { transform: scale(.95); }
.ss-title { margin: 0; font-size: 1.1875rem; font-weight: 700; letter-spacing: -.012em; }
.ss-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; padding: .25rem 1rem calc(var(--sab) + 1.25rem); scrollbar-width: none; }
.ss-body::-webkit-scrollbar { display: none; }

/* home: hero */
.ss-hero { position: relative; flex: none; margin: 0; height: clamp(150px, 35cqh, 296px); border-radius: 1.5rem; overflow: hidden; background: #0f1a38; container-type: size; isolation: isolate; }
.has-history .ss-hero { height: clamp(140px, 22cqh, 188px); }
.ss-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ss-chip {
  --s: max(100cqw / 360, 100cqh / 260);
  position: absolute; right: calc(50% + 34 * var(--s)); transform: translateY(-50%);
  padding: .3125rem .625rem; border-radius: 999px; white-space: nowrap;
  font-size: .75rem; font-weight: 650; letter-spacing: .01em; line-height: 1.2;
  color: #e3f7ff; background: rgba(7, 15, 34, .9); border: 1px solid rgba(103, 221, 252, .38);
}
.ss-chip.c1 { top: calc(50% - 58 * var(--s)); }
.ss-chip.c2 { top: calc(50% + 12 * var(--s)); }
@container (max-width: 299px) { .ss-chip, .ss-art .lead { display: none; } }
.has-history .ss-chip, .has-history .ss-art .lead { display: none; }

/* home: intro + CTA */
.ss-intro { margin-top: 1.25rem; }
.ss-h { margin: 0; font-size: 1.875rem; line-height: 1.06; font-weight: 800; letter-spacing: -.035em; text-wrap: balance; }
.ss-lede { margin: .625rem 0 0; font-size: 1rem; line-height: 1.5; color: var(--ss-text-2); max-width: 34ch; }
.ss-cta-block { margin-top: 1.375rem; }
.ss-cta {
  width: 100%; min-height: 3.25rem; padding: .75rem 1rem; border: 0; border-radius: 1rem;
  display: flex; align-items: center; justify-content: center; gap: .5rem;
  color: #fff !important; font-size: 1.0625rem !important; font-weight: 700; letter-spacing: -.005em;
  background: linear-gradient(90deg, var(--color-brand), var(--color-brand-2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 10px 24px -14px rgba(30, 117, 255, .95);
}
.ss-cta .ic { width: 1.25rem; height: 1.25rem; }
.ss-cta:active { transform: scale(.985); }
.ss-btn2 {
  width: 100%; min-height: 3rem; padding: .625rem 1rem; border-radius: 1rem;
  display: flex; align-items: center; justify-content: center; gap: .5rem;
  font-size: 1rem !important; font-weight: 650; background: transparent; border: 1px solid var(--ss-border); color: var(--color-text);
}
.ss-btn2 .ic { width: 1.125rem; height: 1.125rem; }
.ss-btn3 { min-height: 2.75rem; padding: .5rem 1rem; border: 0; background: none; font-size: .9375rem !important; font-weight: 600; color: var(--ss-text-2) !important; }
.ss-micro { margin: .75rem 0 0; display: flex; align-items: center; justify-content: center; gap: .375rem; text-align: center; font-size: .8125rem; line-height: 1.4; color: var(--ss-text-3); }
.ss-micro .ic { width: .9375rem; height: .9375rem; }

.ss-hint { margin-top: .75rem; display: grid; grid-template-columns: auto 1fr auto; gap: .625rem; align-items: start; padding: .75rem .25rem .75rem .875rem; border-radius: .875rem; background: var(--ss-surface-2); font-size: .875rem; line-height: 1.45; color: var(--ss-text-2); }
.ss-hint .ic { margin-top: .125rem; color: var(--ss-accent); }
.ss-hint b { color: var(--color-text); font-weight: 650; }
.ss-hint .x { width: 2.75rem; height: 2.75rem; margin: -.625rem 0 -.625rem; display: grid; place-items: center; border: 0; background: none; color: var(--ss-text-3); }

.ss-tip { margin-top: 1.375rem; padding-top: 1rem; border-top: 1px solid var(--ss-border); display: grid; grid-template-columns: 2.25rem 1fr; gap: .75rem; align-items: start; }
.ss-tip svg { width: 2.25rem; height: 2.75rem; }
.ss-tip p { margin: 0; font-size: .875rem; line-height: 1.5; color: var(--ss-text-2); }
.ss-tip b { color: var(--color-text); font-weight: 650; }

/* home: recent */
.ss-recent { margin-top: 1.5rem; }
.ss-rhead { display: flex; align-items: center; gap: .5rem; margin-bottom: .375rem; }
.ss-rhead h2 { margin: 0; font-size: .8125rem; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--ss-text-3); }
.ss-rhead .note { font-size: .75rem; color: var(--ss-text-3); opacity: .85; }
.ss-rhead .note::before { content: '·'; margin-right: .5rem; }
.ss-rhead button { margin-left: auto; min-height: 2.75rem; padding: 0 .25rem 0 .75rem; border: 0; background: none; font-size: .875rem !important; font-weight: 600; color: var(--ss-accent) !important; }
.ss-rlist { list-style: none; margin: 0; padding: 0; border-radius: 1rem; background: var(--ss-surface); border: 1px solid var(--ss-border); overflow: hidden; }
.ss-rrow { display: grid; grid-template-columns: 2rem 1fr; gap: .75rem; align-items: start; padding: .8125rem .875rem; }
.ss-rrow + .ss-rrow { border-top: 1px solid var(--ss-border); }
.ss-rrow.is-new { background: color-mix(in srgb, var(--ss-accent) 8%, transparent); }
.ss-glyph { width: 2rem; height: 2rem; border-radius: 999px; display: grid; place-items: center; }
.ss-glyph .ic { width: 1.0625rem; height: 1.0625rem; }
.ss-rtitle { display: block; font-size: .9375rem; line-height: 1.35; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ss-rmeta { display: block; margin-top: .1875rem; font-size: .8125rem; color: var(--ss-text-3); }

.tone-ok { color: var(--color-success); background: var(--ss-ok-bg); }
.tone-bad { color: var(--color-danger); background: var(--ss-bad-bg); }
.tone-warn { color: var(--color-warning); background: var(--ss-warn-bg); }

/* camera (system UI mock) */
.ss-cam { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #000; color: #fff; }
.ss-cam-top { flex: none; display: flex; align-items: center; justify-content: space-between; padding: calc(var(--sat) + .25rem) .5rem .5rem; }
.ss-cam-top button { width: 3rem; height: 3rem; display: grid; place-items: center; border: 0; background: none; color: #fff; }
.ss-cam-tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .62); border: 1px dashed rgba(255, 255, 255, .35); border-radius: 6px; padding: 4px 8px; }
.ss-cam-vf { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.ss-cam-vf img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ss-cam-vf::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 33.2%, rgba(255,255,255,.18) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.18) 66.6%, transparent 66.8%), linear-gradient(180deg, transparent 33.2%, rgba(255,255,255,.18) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.18) 66.6%, transparent 66.8%); }
.ss-cam-bot { flex: none; height: calc(var(--sab) + 8.5rem); display: grid; place-items: center; padding-bottom: var(--sab); }
.ss-shutter { width: 4.5rem; height: 4.5rem; border-radius: 999px; border: 4px solid #fff; background: rgba(255, 255, 255, .92); box-shadow: 0 0 0 4px #000 inset; }
.ss-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.ss-cam.snap .ss-flash { opacity: .85; transition: opacity 60ms; }

/* preview / reading */
.ss-eyebrow { margin: .25rem 0 0; font-size: .75rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--ss-accent); }
.ss-h2 { margin: .375rem 0 0; font-size: 1.375rem; line-height: 1.2; font-weight: 750; letter-spacing: -.02em; }
.ss-photo { position: relative; flex: none; margin-top: 1rem; height: clamp(168px, 42cqh, 420px); border-radius: 1.25rem; overflow: hidden; background: #0a1222; }
.ss-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.ss-photo .br { position: absolute; width: 22px; height: 22px; border: 3px solid #67ddfc; pointer-events: none; }
.ss-photo .br.tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.ss-photo .br.tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
.ss-photo .br.bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
.ss-photo .br.brr { bottom: 10px; right: 10px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
.ss-sweep { position: absolute; left: 0; right: 0; top: 0; height: 30%; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(103, 221, 252, .22) 85%, rgba(103, 221, 252, .9) 99%, transparent); opacity: 0; }
.is-reading .ss-photo img { filter: saturate(.75) brightness(.85); }
.ss-checks { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .5rem; }
.ss-checks li { display: grid; grid-template-columns: 1.25rem 1fr; gap: .625rem; font-size: .9375rem; line-height: 1.4; color: var(--ss-text-2); }
.ss-checks li::before { content: ''; width: .5rem; height: .5rem; margin: .4375rem 0 0 .375rem; border-radius: 2px; background: var(--ss-accent); transform: rotate(45deg); }
.ss-actions { display: flex; gap: .625rem; }
.ss-foot { flex: none; position: relative; z-index: 2; padding: .75rem 1rem calc(var(--sab) + 1rem); background: var(--color-bg); }
.ss-foot::before { content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 1.25rem; background: linear-gradient(180deg, transparent, var(--color-bg)); pointer-events: none; }
.ss-actions.row .ss-btn2 { flex: 1 1 0; }
.ss-actions.row .ss-cta { flex: 1.7 1 0; }
.ss-actions.stack { flex-direction: column; }
.ss-status { margin-top: 1rem; }
.ss-bar { position: relative; height: 4px; border-radius: 2px; overflow: hidden; background: var(--ss-surface-2); }
.ss-bar::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 38%; border-radius: 2px; background: var(--ss-accent); opacity: .9; }
.ss-sub { margin: .75rem 0 0; font-size: .9375rem; color: var(--ss-text-2); min-height: 1.4em; }

/* result */
.ss-res-top { display: grid; grid-template-columns: 1fr auto; gap: .875rem; align-items: start; }
.ss-pill { display: inline-flex; align-items: center; gap: .4375rem; margin-top: .5rem; padding: .375rem .75rem .375rem .5625rem; border-radius: 999px; font-size: .9375rem; font-weight: 700; line-height: 1.2; }
.ss-pill .ic { width: 1.125rem; height: 1.125rem; }
.ss-thumb { width: 3.5rem; height: 4.5rem; border-radius: .75rem; object-fit: cover; border: 1px solid var(--ss-border); background: #0a1222; }
.ss-res-h { margin: 1rem 0 0; font-size: 1.375rem; line-height: 1.28; font-weight: 700; letter-spacing: -.018em; text-wrap: pretty; }
.ss-time { margin-top: 1.125rem; display: grid; grid-template-columns: auto 1fr auto; column-gap: .75rem; align-items: center; padding: .875rem 1rem; border-radius: 1rem; background: var(--ss-surface); border: 1px solid var(--ss-border); }
.ss-time .k { display: block; font-size: .75rem; font-weight: 650; color: var(--ss-text-3); }
.ss-time .v { display: block; white-space: nowrap; margin-top: .125rem; font-size: 1.0625rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.ss-time .v small { display: block; font-size: .8125rem; font-weight: 600; color: var(--ss-text-3); }
.ss-time .end { text-align: right; }
.ss-track { position: relative; min-width: 1.5rem; height: 2px; background: repeating-linear-gradient(90deg, var(--ss-text-3) 0 4px, transparent 4px 8px); opacity: .55; }
.ss-track::before, .ss-track::after { content: ''; position: absolute; top: 50%; width: .625rem; height: .625rem; margin-top: -.3125rem; border-radius: 999px; }
.ss-track::before { left: -2px; background: var(--color-text); }
.ss-track::after { right: -2px; background: var(--ev, var(--color-warning)); }
.ss-advice { margin-top: .75rem; padding: 1rem; border-radius: 1rem; background: var(--ss-surface-2); }
.ss-advice p { margin: 0; display: grid; grid-template-columns: 1.25rem 1fr; gap: .625rem; font-size: 1rem; line-height: 1.4; font-weight: 600; }
.ss-advice p .ic { margin-top: .0625rem; color: var(--ss-accent); }
.ss-remind { margin-top: .875rem; width: 100%; min-height: 2.875rem; border-radius: .875rem; display: flex; align-items: center; justify-content: center; gap: .5rem; font-size: .9375rem !important; font-weight: 650; border: 1px solid color-mix(in srgb, var(--ss-accent) 45%, transparent); background: color-mix(in srgb, var(--ss-accent) 12%, transparent); color: var(--color-text) !important; }
.ss-remind .ic { width: 1.0625rem; height: 1.0625rem; color: var(--ss-accent); }
.ss-remind[aria-pressed="true"] { border-style: dashed; background: transparent; }
.ss-boundary { margin: 1.125rem 0 0; display: grid; grid-template-columns: 1.125rem 1fr; gap: .5rem; font-size: .8125rem; line-height: 1.45; color: var(--ss-text-3); }
.ss-boundary .ic { width: 1.0625rem; height: 1.0625rem; margin-top: .0625rem; }
.ss-boundary b { color: var(--ss-text-2); font-weight: 650; }

/* error */
.ss-err { display: flex; flex-direction: column; flex: 1; }
.ss-err-art { margin: 1.5rem 0 0; width: 7.5rem; height: 6rem; }
.ss-err p.body { margin: .625rem 0 0; font-size: 1rem; line-height: 1.5; color: var(--ss-text-2); }
.ss-err-photo { margin-top: 1.25rem; display: flex; align-items: center; gap: .75rem; font-size: .8125rem; color: var(--ss-text-3); }

/* toast */
.ss-toast { position: absolute; z-index: 30; left: 1rem; right: 1rem; bottom: calc(var(--sab) + 1rem); display: flex; align-items: center; gap: .75rem; padding: .25rem .25rem .25rem 1rem; min-height: 3rem; border-radius: .875rem; background: #e9f1fb; color: #0c2238; font-size: .9375rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .18s, transform .18s; }
.ss-toast.show { opacity: 1; transform: none; pointer-events: auto; }
.ss-toast button { margin-left: auto; min-height: 2.75rem; padding: 0 1rem; border: 0; background: none; font: inherit; font-weight: 750; color: #0b63e6; cursor: pointer; }

/* ── Motion: only when allowed. Nothing on the home screen loops. ───────── */
.motion-ok .ss-art .frame { transform-box: fill-box; transform-origin: center; animation: ss-frame 520ms cubic-bezier(.2, .7, .2, 1) 120ms both; }
.motion-ok .ss-art .scan { animation: ss-art-sweep 1500ms cubic-bezier(.45, 0, .2, 1) 420ms 1 both; }
.motion-ok .ss-art .lead, .motion-ok .ss-chip { animation: ss-fade 420ms ease-out both; }
.motion-ok .ss-art .lead.l1, .motion-ok .ss-chip.c1 { animation-delay: 900ms; }
.motion-ok .ss-art .lead.l2, .motion-ok .ss-chip.c2 { animation-delay: 1060ms; }
.motion-ok .ss-sweep { animation: ss-photo-sweep 2100ms ease-in-out infinite; }
.motion-ok .ss-bar::after { animation: ss-bar 1400ms ease-in-out infinite; }
.motion-ok .ss-rrow.is-new { animation: ss-new 2600ms ease-out 300ms both; }
.motion-ok .ss-screen { animation: ss-in 220ms ease-out both; }
.motion-ok .ss-cta, .motion-ok .ss-btn2, .motion-ok .ss-back { transition: transform 120ms ease-out; }
.ss-art .scan { opacity: 0; }
@keyframes ss-frame { from { opacity: 0; transform: scale(1.07); } to { opacity: 1; transform: none; } }

    <!-- viewfinder frame -->
    <g class="frame">
      <path d="M169 46V36a8 8 0 0 1 8-8h10" ${corner}/>
      <path d="M271 28h10a8 8 0 0 1 8 8v10" ${corner}/>
      <path d="M289 168v10a8 8 0 0 1-8 8h-10" ${corner}/>
      <path d="M187 186h-10a8 8 0 0 1-8-8v-10" ${corner}/>
    </g>
    <g class="scan"><rect x="171" y="0" width="116" height="24" fill="url(#ssBeam)"/><rect x="171" y="24" width="116" height="1.6" fill="#67ddfc"/></g>

}

/* tip glyph: one pole, two signs, a frame around both */
const tipGlyph = `<svg viewBox="0 0 36 44" aria-hidden="true"><rect x="17" y="3" width="2.4" height="40" rx="1" fill="var(--ss-text-3)" opacity=".7"/><rect x="8" y="6" width="20" height="13" rx="2" fill="none" stroke="var(--ss-text-2)" stroke-width="1.6"/><rect x="8" y="22" width="20" height="13" rx="2" fill="none" stroke="var(--ss-text-2)" stroke-width="1.6"/><path d="M3 9V4a2 2 0 0 1 2-2h4M27 2h4a2 2 0 0 1 2 2v5M33 33v5a2 2 0 0 1-2 2h-4M9 40H5a2 2 0 0 1-2-2v-5" stroke="var(--ss-accent)" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>`;

/* sample "photo" (mock camera output) — a made-up sign, not a real location */
const photoSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs><pattern id="b" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#7b4536"/><path d="M0 .5H40M0 10.5H40M20 0V10M1 10V20M41 10V20" stroke="#5a3127" stroke-width="1.6"/></pattern><radialGradient id="v" cx=".5" cy=".45" r=".78"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient><linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="300" height="400" fill="url(#b)"/><rect width="300" height="400" fill="#000" opacity=".2"/><g transform="rotate(-2.5 150 200)"><rect x="144" y="-20" width="12" height="440" fill="#7b828c"/><rect x="144" y="-20" width="3" height="440" fill="#a8afb9"/><g transform="translate(62 50)"><rect width="176" height="128" rx="6" fill="#f3f5f7"/><rect x="5" y="5" width="166" height="118" rx="4" fill="none" stroke="#c43131" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle"><text x="88" y="38" font-size="23" fill="#c43131">NO PARKING</text><text x="88" y="67" font-size="20" fill="#1b1f2a">8AM–6PM</text><text x="88" y="92" font-size="17" fill="#1b1f2a">MON–FRI</text></g><path d="M30 108h116M30 108l9-6M30 108l9 6" stroke="#1b1f2a" stroke-width="3.5" fill="none" stroke-linecap="round"/></g><g transform="translate(62 192)"><rect width="176" height="128" rx="6" fill="#f3f5f7"/><rect x="5" y="5" width="166" height="118" rx="4" fill="none" stroke="#1d6e43" stroke-width="2"/><g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle"><text x="88" y="38" font-size="23" fill="#1d6e43">2 HOUR</text><text x="88" y="64" font-size="19" fill="#1d6e43">PARKING</text><text x="88" y="90" font-size="15" fill="#1b1f2a">7AM–7PM EXCEPT SUN</text></g><path d="M146 10 const PHOTO = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(photoSvg);

const errArt = {
  unreadable: `<svg class="ss-err-art" viewBox="0 0 120 96" aria-hidden="true"><rect x="58" y="10" width="4" height="86" rx="1.5" fill="var(--ss-text-3)" opacity=".5"/><rect x="26" y="16" width="68" height="48" rx="5" fill="var(--ss-surface-2)" stroke="var(--ss-border)"/><g fill="var(--ss-text-3)" opacity=".45"><rect x="36" y="26" width="40" height="5" rx="2.5"/><rect x="36" y="36" width="30" height="4" rx="2"/><rect x="36" y="45" width="36" height="4" rx="2"/></g><path d="M64 16 46 64M80 16 62 64" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/><path d="M14 22v-6a6 6 0 0 1 6-6h6M94 10h6a6 6 0 0 1 6 6v6M106 58v6a6 6 0 0 1-6 6h-6M26 70h-6a6 6 0 0 1-6-6v-6" stroke="var(--ss-accent)" stroke-width="2.6" stroke-linecap="round" fill="none" stroke-dasharray="7 5"/></svg>`,
  unavailable: `<svg class="ss-err-art" viewBox="0 0 120 96" aria-hidden="true"><circle cx="60" cy="48" r="40" fill="var(--ss-surface-2)"/><g transform="translate(36 24) scale(2)" fill="none" stroke="var(--ss-text-2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/></g></svg>`,
};

/* ── time helpers ── */
const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function dayWord(d) {
  const now = new Date(), tm = new Date(now); tm.setDate(now.getDate() + 1);
  if (d.toDateString() === now.toDateString()) return '';
  if (d.toDateString() === tm.toDateString()) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday: 'long' });
}
function fmtAt(d) {
  const now = new Date(), tm = new Date(now); tm.setDate(now.getDate() + 1);
  if (d.toDateString() === now.toDateString()) return `at ${fmtTime(d)}`;
  if (d.toDateString() === tm.toDateString()) return `tomorrow at ${fmtTime(d)}`;
  return `${d.toLocaleDateString([], { weekday: 'long' })} at ${fmtTime(d)}`;
}
function fmtIn(d) {
  const mins = Math.round((d - Date.now()) / 60000);
  if (mins < 60) return `in ${mins} min`;
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h >= 20) return '';
  return m ? `in ${h} hr ${m} min` : `in ${h} hr`;
}
function fmtScanTs(ts) {
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return fmtTime(d);
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString();
}
const round5 = d => { const x = new Date(d); x.setSeconds(0, 0); x.setMinutes(Math.ceil(x.getMinutes() / 5) * 5); return x; };

/* ── mock analyzeSign responses (SignAnalysisResult shape) ── */
function mockResult(kind) {
  const now = new Date();
  const limit = round5(new Date(now.getTime() + 120 * 60000));
  const opens = round5(new Date(now.getTime() + 195 * 60000));
  const sweep = new Date(now); sweep.setDate(now.getDate() + 1); sweep.setHours(11, 30, 0, 0);
  switch (kind) {
    case 'yes': return { status: 'YES', explanation: `Two-hour parking is allowed here now. The limit runs out at ${fmtTime(limit)}.`, restrictionStartsAt: limit.toISOString(), restrictionEndsAt: null, actionableAdvice: `Move your car by ${fmtTime(limit)}.` };
    case 'later': return { status: 'CONDITIONAL', explanation: 'You can park now, but street cleaning starts tomorrow at 11:30 AM.', restrictionStartsAt: sweep.toISOString(), restrictionEndsAt: null, actionableAdvice: 'Move your car before 11:30 AM tomorrow.' };
    case 'no': return { status: 'NO', explanation: `No parking until ${fmtTime(opens)} on weekdays, and that rule is in effect now.`, restrictionStartsAt: null, restrictionEndsAt: opens.toISOString(), actionableAdvice: `Find another spot, or come back after ${fmtTime(opens)}.` };
    case 'unclear': return { status: 'CONDITIONAL', explanation: 'The bottom of the lower sign is cut off, so its hours are unclear.', restrictionStartsAt: null, restrictionEndsAt: null, actionableAdvice: null };
    case 'unreadable': return { status: 'ERROR', explanation: "Couldn't read this sign\nTry taking another photo with the full sign visible and in focus." };
    default: return { status: 'ERROR', explanation: 'Assistant temporarily unavailable\nThe AI service is temporarily unavailable. Please try again shortly.' };
  }
}
/* geminiService only distinguishes its two error branches by text; implementation would add an errorKind client-side. */
const errorKind = r => /temporarily unavailable/i.test(r.explanation) ? 'unavailable' : 'unreadable';

function verdict(r) {
  const timed = !!(r.restrictionStartsAt || r.restrictionEndsAt);
  if (r.status === 'YES') return { tone: 'ok', icon: 'check', label: 'Parking appears allowed' };
  if (r.status === 'NO') return { tone: 'bad', icon: 'octagon', label: 'Parking appears prohibited' };
  return timed ? { tone: 'warn', icon: 'clock', label: 'Depends on the time' } : { tone: 'warn', icon: 'help', label: 'Unclear from this photo' };
}
const recentMeta = { YES: { tone: 'ok', icon: 'check', word: 'Appears allowed' }, NO: { tone: 'bad', icon: 'octagon', word: 'Appears prohibited' }, CONDITIONAL: { tone: 'warn', icon: 'clock', word: 'Conditional' } };

function seedHistory() {
  const now = Date.now();
  return [
    { id: 'h1', status: 'CONDITIONAL', title: 'You can park now, but street cleaning starts tomorrow at 11:30 AM.', ts: now - 42 * 60000 },
    { id: 'h2', status: 'NO', title: 'No standing at any time on this side of the block.', ts: now - 26 * 3600000 },
    { id: 'h3', status: 'YES', title: 'One-hour metered parking, 9 AM to 7 PM except Sunday.', ts: now - 74 * 3600000 },
  ];
}

/* ── state ── */
const S = {
  vp: VP[params.get('vp')] ? params.get('vp') : 's20',
  theme: params.get('theme') === 'light' ? 'light' : 'dark',
  motion: params.get('motion') === 'reduce' ? 'reduce' : 'auto',
  text: [1, 1.15, 1.3].includes(+params.get('text')) ? +params.get('text') : 1,
  scenario: params.get('scn') || 'yes',
  screen: 'home', history: [], result: null, missHint: false, reminder: false, newId: null,
};
let readToken = 0, msgTimer = null, lastScreen = null, toastTimer = null;

/* ── screens ── */
const header = (backAct, backLabel) => `
  <header class="ss-head">
    <button type="button" class="ss-back" data-act="${backAct}" aria-label="${backLabel}">${ic('back')}</button>
    <h1 class="ss-title" ${S.screen === 'home' ? 'data-focus tabindex="-1"' : ''}>Sign Scanner</h1>
  </header>`;

function homeScreen() {
  const has = S.history.length > 0;
  const recent = !has ? '' : `
    <section class="ss-recent" aria-labelledby="ss-rec-h">
      <div class="ss-rhead"><h2 id="ss-rec-h">Recent scans</h2><span class="note">On this phone</span><button type="button" data-act="clear">Clear</button></div>
      <ul class="ss-rlist">${S.history.map(h => {
        const m = recentMeta[h.status];
        return `<li class="ss-rrow ${h.id === S.newId ? 'is-new' : ''}"><span class="ss-glyph tone-${m.tone}">${ic(m.icon)}</span><span><span class="ss-rtitle">${h.title}</span><span class="ss-rmeta">${m.word} · ${fmtScanTs(h.ts)}</span></span></li>`;
      }).join('')}</ul>
    </section>`;
  const hint = !S.missHint ? '' : `
    <div class="ss-hint" role="status">${ic('info')}<span><b>No photo was taken.</b> If your camera didn't open, check that ParQueen is allowed to use it in your phone's Settings.</span><button type="button" class="x" data-act="hint-x" aria-label="Dismiss">${ic('x')}</button></div>`;
  return `${header('leave', 'Back to the map')}
  <main class="ss-body ss-screen ${has ? 'has-history' : ''}">
    <figure class="ss-hero" aria-hidden="true">${heroArt(has)}</figure>
    <section class="ss-intro">
      <h2 class="ss-h">Know before you park.</h2>
      <p class="ss-lede">Photograph a parking sign and ParQueen explains its days, hours, and limits in plain language.</p>
    </section>
    <div class="ss-cta-block">
      <button type="button" class="ss-cta" data-act="scan">${ic('camera')}Scan a Sign</button>
      <p class="ss-micro">${ic('lock')}Your camera is only used for this sign.</p>
      ${hint}
    </div>
    ${has ? '' : `<aside class="ss-tip">${tipGlyph}<p><b>Get the whole pole in frame.</b> Include every sign above and below — a second sign can change the rule.</p></aside>`}
    ${recent}
  </main>`;
}

const cameraScreen = () => `
  <div class="ss-cam" role="dialog" aria-label="Camera">
    <div class="ss-cam-top"><button type="button" data-act="cam-cancel" aria-label="Close camera">${ic('x')}</button><span class="ss-cam-tag">System camera · not ParQueen UI</span><span style="width:3rem"></span></div>
    <div class="ss-cam-vf"><img src="${PHOTO}" alt=""></div>
    <div class="ss-cam-bot"><button type="button" class="ss-shutter" data-act="shutter" aria-label="Take photo"></button></div>
    <div class="ss-flash"></div>
  </div>`;

const photoFrame = reading => `
  <div class="ss-photo"><img src="${PHOTO}" alt="Your photo of the parking sign">
    <span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br brr"></span>
    ${reading ? '<span class="ss-sweep" aria-hidden="true"></span>' : ''}</div>`;

const previewScreen = () => `${header('home', 'Discard photo')}
  <main class="ss-body ss-screen">
    <p class="ss-eyebrow">Check your photo</p>
    <h2 class="ss-h2" data-focus tabindex="-1">Is the whole sign readable?</h2>
    ${photoFrame(false)}
    <ul class="ss-checks"><li>Every line of text is in frame and in focus</li><li>Signs above or below it on the pole are included</li></ul>
    </main>
  <footer class="ss-foot ss-actions row">
      <button type="button" class="ss-btn2" data-act="retake">${ic('retake')}Retake</button>
      <button type="button" class="ss-cta" data-act="read">${ic('scan')}Read this sign</button>
    </footer>`;

const readingScreen = () => `${header('home', 'Stop and discard photo')}
  <main class="ss-body ss-screen is-reading">
    <p class="ss-eyebrow">One moment</p>
    <div role="status" aria-live="polite"><h2 class="ss-h2" data-focus tabindex="-1">Reading the sign…</h2></div>
    ${photoFrame(true)}
    <div class="ss-status"><div class="ss-bar" aria-hidden="true"></div><p class="ss-sub" id="ss-sub">Checking the days and hours…</p></div>
    </main>
  <footer class="ss-foot ss-actions stack"><button type="button" class="ss-btn3" data-act="home">Cancel</button></footer>`;

function resultScreen() {
  const r = S.result, v = verdict(r);
  const startsAt = r.restrictionStartsAt && new Date(r.restrictionStartsAt);
  const endsAt = r.restrictionEndsAt && new Date(r.restrictionEndsAt);
  const ev = startsAt ? { k: 'Restriction starts', d: startsAt, c: 'var(--color-warning)' } : endsAt ? { k: 'Restriction ends', d: endsAt, c: 'var(--color-success)' } : null;
  const timeline = !ev ? '' : `
    <div class="ss-time" role="group" aria-label="Timing">
      <span><span class="k">Now</span><span class="v">${fmtTime(new Date())}<small>Today</small></span></span>
      <span class="ss-track" style="--ev:${ev.c}" aria-hidden="true"></span>
      <span class="end"><span class="k">${ev.k}</span><span class="v">${fmtTime(ev.d)}<small>${[dayWord(ev.d), fmtIn(ev.d)].filter(Boolean).join(' · ') || '&nbsp;'}</small></span></span>
    </div>`;
  /* Reminder: proposed 10 min lead (today: fires at the restriction time itself). Not offered when parking appears prohibited. */
  let remindAt = null;
  if (startsAt && r.status !== 'NO') {
    remindAt = new Date(startsAt.getTime() - 10 * 60000);
    if (remindAt - Date.now() < 60000) remindAt = startsAt;
  }
  const advice = !r.actionableAdvice ? '' : `
    <div class="ss-advice"><p>${ic('clock')}<span>${r.actionableAdvice}</span></p>
      ${remindAt ? `<button type="button" class="ss-remind" data-act="remind" aria-pressed="${S.reminder}">${S.reminder ? ic('bellOk') + `Reminder set ${fmtAt(remindAt).replace(/^at /, 'for ')}` : ic('bell') + `Remind me ${fmtAt(remindAt)}`}</button>` : ''}
    </div>`;
  const unclear = r.status === 'CONDITIONAL' && !ev;
  const unclearTip = !unclear ? '' : `<ul class="ss-checks"><li>Step back so the whole sign fits, then retake for a clearer read</li><li>Until then, follow the posted sign itself</li></ul>`;
  const actions = unclear
    ? `<button type="button" class="ss-cta" data-act="retake">${ic('retake')}Retake photo</button><button type="button" class="ss-btn2" data-act="leave">${ic('map')}Back to map</button>`
    : `<button type="button" class="ss-cta" data-act="leave">${ic('map')}Back to map</button><button type="button" class="ss-btn2" data-act="scan">${ic('camera')}Scan another sign</button>`;
  return `${header('home', 'Back to Sign Scanner')}
  <main class="ss-body ss-screen">
    <div role="status" aria-live="polite">
      <div class="ss-res-top">
        <div><p class="ss-eyebrow">What the sign appears to say</p><span class="ss-pill tone-${v.tone}">${ic(v.icon)}${v.label}</span></div>
        <img class="ss-thumb" src="${PHOTO}" alt="Your sign photo">
      </div>
      <h2 class="ss-res-h" data-focus tabindex="-1">${r.explanation}</h2>
    </div>
    ${timeline}${advice}${unclearTip}
    <p class="ss-boundary">${ic('info')}<span><b>ParQueen's interpretation of your photo — not verified legal permission.</b> The posted signs, curb markings, and local rules always apply.</span></p>
    </main>
  <footer class="ss-foot ss-actions stack">${actions}</footer>`;
}

function errorScreen() {
  const kind = errorKind(S.result);
  const copy = kind === 'unavailable'
    ? { h: 'Sign reading is unavailable right now.', b: "That's on our end, not your photo. Try again in a moment — your photo is still here.", p: `<button type="button" class="ss-cta" data-act="read">${ic('retry')}Try again</button>`, s: `<button type="button" class="ss-btn2" data-act="retake">${ic('retake')}Retake photo</button>` }
    : { h: "We couldn't read that sign.", b: 'The text may be blurry, cut off, or catching glare. Step back a little and fit the whole sign in the frame.', p: `<button type="button" class="ss-cta" data-act="retake">${ic('camera')}Retake photo</button>`, s: `<button type="button" class="ss-btn2" data-act="read">${ic('retry')}Try this photo again</button>` };
  return `${header('home', 'Back to Sign Scanner')}
  <main class="ss-body ss-screen ss-err">
    ${errArt[kind]}
    <div role="alert"><h2 class="ss-h2" data-focus tabindex="-1">${copy.h}</h2></div>
    <p class="body">${copy.b}</p>
    <div class="ss-err-photo"><img class="ss-thumb" src="${PHOTO}" alt="The photo you took">Nothing was saved to your recent scans.</div>
    </main>
  <footer class="ss-foot ss-actions stack">${copy.p}${copy.s}</footer>`;
}

/* ── notes beside the device ── */
const NOTES = {
  home: h => `<h3>${h ? 'Home · returning' : 'Home · first visit'}</h3>
    <span class="k">Hierarchy</span><ul><li>Header: back to map + “Sign Scanner”.</li><li>Illustration → headline → one-line value → <b>Scan a Sign</b> (only filled control).</li><li>${h ? 'Hero shrinks and the tip and annotations drop away, so recent scans fit above the fold.' : 'Annotations name what the scanner reads. One tip about stacked signs.'}</li></ul>
    <span class="k">Data</span><ul><li>Recent scans = <code>loadRecentScans()</code> (title, verdict, time; max 5; on this phone only). The section isn't rendered at all when empty.</li><li>“Clear” wires the existing, unused <code>clearRecentScans()</code>, with Undo.</li></ul>
    <span class="k">Not here</span><ul><li>No Hydrant Distance, no Am I Safe Here, no placeholders.</li><li>No “Choose a Photo”. The scanner has been camera-only since <code>700e6c2</code> (iOS Photos-permission rejection).</li></ul>`,
  camera: () => `<h3>Camera handoff</h3><ul><li>Real app: the existing hidden <code>&lt;input capture="environment"&gt;</code> opens the phone's own camera. This screen is a stand-in for system UI ParQueen doesn't control.</li><li>Android declares no CAMERA permission (intent capture needs none). iOS shows its own one-time prompt using <code>NSCameraUsageDescription</code>. There's no custom pre-prompt; the line under the CTA explains the camera use first.</li><li>Close (×) leads to the “no photo” hint.</li></ul>`,
  miss: () => `<h3>Camera returned no photo</h3><ul><li>Detectable today: focus comes back to the WebView with no file selected (the view already listens for <code>focus</code> to release its capture lock).</li><li>One calm inline hint, which can be dismissed. It covers both cancelling and a blocked camera, with no alarm.</li></ul>`,
  preview: () => `<h3>Preview · check the photo</h3><ul><li>Keeps the existing rule: <b>no model call until the user confirms</b>.</li><li>Photo uses object-contain, so tall signs never get cropped (Samsung Phase 2D finding).</li><li>Retake / Read sit side by side (positive action on the right, per Android) to save vertical space. Header back throws the photo away.</li></ul>`,
  reading: () => `<h3>Reading</h3><ul><li>Polite live region. The sub-line rotates between the existing “Reading the sign” and “Checking the days and hours” strings.</li><li>The sweep loops only while waiting. With reduced motion, the sweep and the progress bar are static.</li><li>Cancel and header back drop the result when it comes back (implementation: request token, like <code>inFlightRef</code>).</li></ul>`,
  result: r => `<h3>Result · ${verdict(r).label}</h3><ul><li>Maps to <code>status: ${r.status}</code>${r.restrictionStartsAt ? ', <code>restrictionStartsAt</code>' : ''}${r.restrictionEndsAt ? ', <code>restrictionEndsAt</code>' : ''}${r.actionableAdvice ? ', <code>actionableAdvice</code>' : ''}.</li><li>The eyebrow and the pill use “appears” wording. A fixed boundary line separates the reading from verified permission.</li><li>Timing strip only when the service returned a time. The reminder uses the existing <code>useParkingTimer</code>; the 10-minute lead is a proposed change. No reminder when parking appears prohibited.</li>${r.status === 'CONDITIONAL' && !r.restrictionStartsAt && !r.restrictionEndsAt ? '<li>CONDITIONAL with no times is treated as “unclear”, so Retake becomes the primary button. The schema can’t tell “depends on the time” from “partly legible”.</li>' : ''}<li>Recorded to recent scans (not errors), shown as “new” on the home screen.</li></ul>`,
  error: r => `<h3>Error · ${errorKind(r)}</h3><ul><li>The two existing <code>geminiService</code> error branches get distinct recovery paths: an unreadable photo → <b>Retake</b> first; a service problem, including the 30-per-hour rate limit → <b>Try again</b> first, with the same photo.</li><li>No AI disclaimer on errors (existing safety test). Nothing is recorded.</li></ul>`,
};

/* ── render ── */
function applyEnv() {
  const v = VP[S.vp], dev = $('#device');
  dev.style.width = v.w + 'px'; dev.style.height = v.h + 'px';
  dev.style.setProperty('--sat', v.sat + 'px'); dev.style.setProperty('--sab', v.sab + 'px');
  $('.gbar').style.display = v.sab ? '' : 'none';
  document.documentElement.classList.toggle('dark', S.theme === 'dark');
  document.documentElement.style.fontSize = 16 * S.text + 'px';
  const reduce = S.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('#app').classList.toggle('motion-ok', !reduce);
  $('#c-vp').value = S.vp; $('#c-theme').value = S.theme; $('#c-motion').value = S.motion; $('#c-text').value = String(S.text); $('#c-scn').value = S.scenario;
}

function render() {
  const app = $('#app');
  clearInterval(msgTimer);
  const html = S.screen === 'home' ? homeScreen()
    : S.screen === 'camera' ? homeScreen() + cameraScreen()
    : S.screen === 'preview' ? previewScreen()
    : S.screen === 'reading' ? readingScreen()
    : S.screen === 'result' ? resultScreen()
    : errorScreen();
  app.innerHTML = html;
  $('#device').classList.toggle('on-camera', S.screen === 'camera');
  const notes = S.screen === 'home' ? (S.missHint ? NOTES.miss() + NOTES.home(S.history.length > 0) : NOTES.home(S.history.length > 0))
    : S.screen === 'camera' ? NOTES.camera() : S.screen === 'result' ? NOTES.result(S.result)
    : S.screen === 'error' ? NOTES.error(S.result) : NOTES[S.screen]();
  $('#notes').innerHTML = notes;
  if (S.screen === 'reading') {
    const msgs = ['Checking the days and hours…', 'Reading the posted times…'];
    let i = 0;
    msgTimer = setInterval(() => { const el = $('#ss-sub'); if (el) el.textContent = msgs[++i % msgs.length]; }, 1500);
  }
  if (S.screen !== lastScreen) {
    const f = S.screen === 'camera' ? app.querySelector('.ss-shutter') : app.querySelector('[data-focus]');
    if (f && lastScreen !== null) f.focus({ preventScroll: true });
    lastScreen = S.screen;
  }
}

function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${msg}</span>${undo ? '<button type="button" id="toast-undo">Undo</button>' : ''}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 2600);
  if (undo) $('#toast-undo').onclick = () => { undo(); t.classList.remove('show'); };
}

function startReading() {
  S.screen = 'reading'; S.reminder = false; render();
  const token = ++readToken;
  setTimeout(() => {
    if (token !== readToken || S.screen !== 'reading') return;
    S.result = mockResult(S.scenario);
    if (S.result.status === 'ERROR') { S.screen = 'error'; }
    else {
      S.screen = 'result';
      const entry = { id: 'n' + Date.now(), status: S.result.status, title: S.result.explanation.split('\n')[0], ts: Date.now() };
      S.history = [entry, ...S.history].slice(0, 5); S.newId = entry.id;
    }
    render();
  }, 2600);
}

function act(a) {
  switch (a) {
    case 'leave': toast('In the app, this returns to the map.'); break;
    case 'scan': case 'retake': S.missHint = false; S.screen = 'camera'; render(); break;
    case 'cam-cancel': S.screen = 'home'; S.missHint = true; render(); break;
    case 'shutter': {
      const cam = $('.ss-cam'); cam.classList.add('snap');
      setTimeout(() => { S.screen = 'preview'; render(); }, 160); break;
    }
    case 'home': readToken++; S.screen = 'home'; render(); break;
    case 'read': startReading(); break;
    case 'remind': if (!S.reminder) { S.reminder = true; render(); } break;
    case 'hint-x': S.missHint = false; render(); break;
    case 'clear': {
      const prev = S.history; S.history = []; S.newId = null; render();
      toast('Recent scans cleared', () => { S.history = prev; render(); }); break;
    }
  }
}

function goState(key) {
  readToken++; S.missHint = false; S.reminder = false; S.newId = null;
  const [scr, sub] = key.split('-');
  if (scr === 'home') { S.screen = 'home'; S.history = sub === 'history' ? seedHistory() : []; }
  else if (key === 'camera') { S.screen = 'camera'; }
  else if (key === 'camera-miss') { S.screen = 'home'; S.missHint = true; S.history = []; }
  else if (scr === 'preview') { S.screen = 'preview'; }
  else if (scr === 'reading') { S.screen = 'reading'; render(); return; }
  else if (scr === 'result') { S.result = mockResult(sub); S.screen = 'result'; }
  else if (scr === 'error') { S.result = mockResult(sub); S.screen = 'error'; }
  render();
}

$('#app').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act); });
$('#c-vp').onchange = e => { S.vp = e.target.value; applyEnv(); render(); };
$('#c-theme').onchange = e => { S.theme = e.target.value; applyEnv(); };
$('#c-motion').onchange = e => { S.motion = e.target.value; applyEnv(); render(); };
$('#c-text').onchange = e => { S.text = +e.target.value; applyEnv(); };
$('#c-scn').onchange = e => { S.scenario = e.target.value; };
$('#c-state').onchange = e => { if (e.target.value) goState(e.target.value); e.target.value = ''; };
// Android-style system Back for keyboard testing: Escape.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.screen === 'camera') act('cam-cancel'); else if (S.screen === 'home') act('leave'); else act('home');
});

if (params.get('clean') === '1') document.body.classList.add('clean');
applyEnv();
goState(params.get('state') || 'home-first');
})();
</script>
</body>
</html>
