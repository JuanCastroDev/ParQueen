appId: app.parqueen
androidWebViewHierarchy: devtools
---
- launchApp:
    permissions:
      all: allow

- setLocation:
    latitude: 40.8275
    longitude: -73.9258

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Get Started"
    timeout: 20000

- tapOn:
    text: "Get Started"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 3000

- assertVisible: "See spots opening near you"

- tapOn:
    text: "Continue"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 3000

- assertVisible: "Save your car. Know the rules."

- tapOn:
    text: "Continue"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 3000

- assertVisible: "Step 1 of 4"
- assertVisible: "What's your number?"

- assertVisible:
    id: "phone-input"

- tapOn:
    id: "phone-input"
    retryTapIfNoChange: true

- inputText: ${DRIVER_PHONE}

- hideKeyboard

- assertVisible: "Send code"

- tapOn:
    text: "Send code"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 20000

- assertVisible: "Step 2 of 4"
- assertVisible: "Enter the 6-digit code"

- assertVisible:
    id: "otp-input"

- tapOn:
    id: "otp-input"

- inputText: ${DRIVER_OTP}

- extendedWaitUntil:
    visible: "Welcome to ParQueen"
    timeout: 20000

- assertVisible: "Welcome to ParQueen"
- assertVisible: "Start Tour"
- assertVisible: "Skip"

- tapOn:
    text: "Skip"
    retryTapIfNoChange: true

- assertVisible: "Map"
- assertVisible: "Nearby Activity.*"
- assertVisible: "Ping Your Spot"
- assertVisible: "Messages.*"
- assertVisible: "Profile"

- tapOn:
    text: "Nearby Activity.*"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "LIVE NEARBY"
    timeout: 20000

- extendedWaitUntil:
    visible: "Available now, 52 East 161st Street.*"
    timeout: 20000

- tapOn:
    text: "Available now, 52 East 161st Street.*"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Available spot"
    timeout: 15000

- assertVisible: "maestrofinder3436"
- assertVisible: "Leaving now"
- assertVisible: "I'm heading there"

- tapOn:
    text: "I'm heading there"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Heading to this spot"
    timeout: 20000

- assertVisible: "maestrofinder3436"
- assertVisible: "I've arrived"

- takeScreenshot: core-handoff-driver-claimed
