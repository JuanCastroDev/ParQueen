appId: app.parqueen
androidWebViewHierarchy: devtools
---
- launchApp:
    permissions:
      all: allow

- setLocation:
    latitude: 40.8275
    longitude: -73.9258

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Get Started"
    timeout: 20000

- tapOn:
    text: "Get Started"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 3000

- assertVisible: "See spots opening near you"

- tapOn:
    text: "Continue"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 3000

- assertVisible: "Save your car. Know the rules."

- tapOn:
    text: "Continue"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 3000

- assertVisible: "Step 1 of 4"
- assertVisible: "What's your number?"

- assertVisible:
    id: "phone-input"

- tapOn:
    id: "phone-input"
    retryTapIfNoChange: true

- inputText: ${FINDER_PHONE}

- hideKeyboard

- assertVisible: "Send code"

- tapOn:
    text: "Send code"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Enter the 6-digit code"
    timeout: 20000

- assertVisible: "Step 2 of 4"
- assertVisible: "Enter the 6-digit code"

- assertVisible:
    id: "otp-input"

- tapOn:
    id: "otp-input"

- inputText: ${FINDER_OTP}

- extendedWaitUntil:
    visible: "Welcome to ParQueen"
    timeout: 20000

- assertVisible: "Welcome to ParQueen"
- assertVisible: "Start Tour"
- assertVisible: "Skip"

- tapOn:
    text: "Skip"
    retryTapIfNoChange: true

- assertVisible: "Map"
- assertVisible: "Nearby Activity"
- assertVisible: "Ping Your Spot"
- assertVisible: "Messages.*"
- assertVisible: "Profile"

- tapOn:
    text: "Ping Your Spot"
    retryTapIfNoChange: true

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "When are you leaving this spot?"
    timeout: 5000

- extendedWaitUntil:
    visible: "Leaving now.*"
    timeout: 5000

- assertVisible: "Leaving later.*"
- assertVisible: "Ping now"

- tapOn:
    text: "Ping now"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Map"
    timeout: 20000

- tapOn:
    text: "Ping Your Spot"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Ping Active"
    timeout: 10000

- assertVisible: "Your spot is live"
- assertVisible: "Available now"
- assertVisible: "Edit Ping"
- assertVisible: "Delete Ping"

- takeScreenshot: core-handoff-finder-ping-created
