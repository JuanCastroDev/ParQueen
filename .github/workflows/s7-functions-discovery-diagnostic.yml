name: S7 Functions discovery diagnostic

on:
  push:
    branches:
      - review/s7-functions-discovery-diagnostic-20261107
    paths:
      - .github/workflows/s7-functions-discovery-diagnostic.yml
      - scripts/release-preflight/s7-functions-discovery-probe.mjs

permissions:
  contents: read

jobs:
  discovery:
    name: Bounded Functions discovery probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI 15.24.0
        run: npm install -g firebase-tools@15.24.0

      - name: Probe isolated Functions discovery
        run: node scripts/release-preflight/s7-functions-discovery-probe.mjs
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Upload structured discovery result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s7-functions-discovery-result
          if-no-files-found: error
          path: |
            s7-discovery-probe-out/result.txt
            s7-discovery-probe-out/milestones.json

      - name: Keep Functions integration unverified
        if: always()
        run: |
          echo "FUNCTIONS_INTEGRATION_UNVERIFIED"
          exit 1
