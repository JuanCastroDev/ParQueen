name: iOS Signed Archive

# Stage C0. The signing job is manual and main-only.
# Pull requests run the contract job only. They do not sign, export, or
# receive Apple or production build secret values.

on:
  pull_request:
    paths:
      - .github/workflows/ios-signed-archive.yml
      - docs/IOS_SIGNED_ARCHIVE.md
      - ios/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - vite.config.ts
      - productionBuildConfig.ts
      - firebaseConfig.ts
      - index.tsx
      - sentryRelease.ts
      - utils/appCheck.ts
      - utils/appCheckPlatform.ts
      - utils/browserCredentials.ts
      - utils/sentryInit.ts
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirmation required to archive on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: signing contract
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: macOS and Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          echo "Selected Xcode version: ${XCODE_VERSION}"
          if ! [[ "${XCODE_MAJOR}" =~ ^[0-9]+$ ]] || [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "::error::Xcode major version '${XCODE_MAJOR}' is below 26."
            exit 1
          fi

      - name: Assert Release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          test -f "${PBX}"
          BUNDLES="$(grep "PRODUCT_BUNDLE_IDENTIFIER = " "${PBX}" | sed -E 's/.*PRODUCT_BUNDLE_IDENTIFIER = //; s/;//g; s/[[:space:]]//g' | sort -u)"
          if [ "${BUNDLES}" != "app.parqueen" ]; then
            echo "::error::PRODUCT_BUNDLE_IDENTIFIER is not exactly app.parqueen."
            exit 1
          fi
          for setting in "MARKETING_VERSION = 1.0;" "CURRENT_PROJECT_VERSION = 1;" "IPHONEOS_DEPLOYMENT_TARGET = 15.0;" "CODE_SIGN_STYLE = Automatic;"; do
            if ! grep -F -q "${setting}" "${PBX}"; then
              echo "::error::Missing expected project setting: ${setting}"
              exit 1
            fi
          done
          if grep -R -n "DEVELOPMENT_TEAM" ios --include='*.pbxproj' --include='*.xcconfig' --include='*.plist'; then
            echo "::error::DEVELOPMENT_TEAM must stay unset in source."
            exit 1
          fi
          if grep -R -n "PROVISIONING_PROFILE\|CODE_SIGN_ENTITLEMENTS\|aps-environment" ios --include='*.pbxproj' --include='*.xcconfig' --include='*.plist' --include='*.entitlements'; then
            echo "::error::Provisioning profile, entitlements, or aps-environment is present."
            exit 1
          fi
          if find ios -name '*.entitlements' -print | grep -q .; then
            echo "::error::An entitlements file is present."
            exit 1
          fi
          echo "Release signing configuration matches the unsigned baseline."

      - name: Confirm scheme App
        shell: bash
        run: |
          set -euo pipefail
          LIST="${RUNNER_TEMP}/xcodebuild-list.txt"
          xcodebuild -list -project ios/App/App.xcodeproj > "${LIST}"
          SCHEMES="$(awk '/^[[:space:]]*Schemes:/{flag=1;next} flag && /^[[:space:]]*$/{exit} flag' "${LIST}")"
          printf '%s\n' "${SCHEMES}"
          if ! printf '%s\n' "${SCHEMES}" | grep -E -q '^[[:space:]]+App$'; then
            echo "::error::Scheme App was not listed."
            exit 1
          fi

      - name: Assert workflow security contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(".github/workflows/ios-signed-archive.yml").read_text().replace("\r\n", "\n")
          forbidden = [
              "al" + "tool",
              "notary" + "tool",
              "destination=" + "upload",
              "-upload" + "App",
              "upload-" + "artifact",
              "pull_request" + "_target",
              "set " + "-x",
          ]
          for needle in forbidden:
              if needle in text:
                  print(f"forbidden workflow token: {needle}")
                  sys.exit(1)
          if ("contents: " + "write") in text:
              print("workflow requests contents write")
              sys.exit(1)
          if not re.search(r"(?m)^permissions:\n  contents: read\s*$", text):
              print("workflow permissions are not contents read")
              sys.exit(1)
          required = [
              "workflow_dispatch",
              "SIGN_PARQUEEN",
              "refs/heads/main",
              "app-store-connect",
              "macos-26",
              "app.parqueen",
              "-allowProvisioningUpdates",
              "-authenticationKeyPath",
              "-authenticationKeyID",
              "-authenticationKeyIssuerID",
              'DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"',
              "manageAppVersionAndBuildNumber",
          ]
          secret_ref = "secrets" + "."
          for needle in required:
              if needle not in text:
                  print(f"missing workflow contract text: {needle}")
                  sys.exit(1)
          if secret_ref + "APPLE_TEAM_ID" not in text:
              print("missing workflow contract text: Apple team secret reference")
              sys.exit(1)
          if re.search(r"DEVELOPMENT_TEAM=[A-Z0-9]{10}([^A-Z0-9]|$)", text):
              print("workflow contains a literal Team ID")
              sys.exit(1)
          parts = text.split("\n  signed-archive:\n", 1)
          if len(parts) != 2:
              print("signed-archive job was not found")
              sys.exit(1)
          before, signed = parts
          if secret_ref in before:
              print("secrets are referenced outside the signed job")
              sys.exit(1)
          for needle in (
              "github.event_name == 'workflow_dispatch'",
              "github.ref == 'refs/heads/main'",
              "needs.dispatch-guard.result == 'success'",
          ):
              if needle not in signed.split("\n    steps:", 1)[0]:
                  print(f"signed job guard missing: {needle}")
                  sys.exit(1)
          guard = before.split("\n  dispatch-guard:\n", 1)
          if len(guard) != 2 or "SIGN_PARQUEEN" not in guard[1] or "refs/heads/main" not in guard[1]:
              print("dispatch guard does not require main and the confirmation phrase")
              sys.exit(1)
          if secret_ref in guard[1]:
              print("dispatch guard references secrets")
              sys.exit(1)
          print("workflow security contract: PASS")
          PY

  dispatch-guard:
    name: dispatch guard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and confirmation
        env:
          REF_NAME: ${{ github.ref }}
          CONFIRM_TEXT: ${{ github.event.inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${REF_NAME}" = "refs/heads/main" ] && [ "${CONFIRM_TEXT}" = "SIGN_PARQUEEN" ]; then
            echo "dispatch guard: accepted"
            exit 0
          fi
          echo "dispatch guard: rejected"
          exit 1

  signed-archive:
    name: signed archive
    needs: [contract, dispatch-guard]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.dispatch-guard.result == 'success'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: macOS and Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          echo "Selected Xcode version: ${XCODE_VERSION}"
          if ! [[ "${XCODE_MAJOR}" =~ ^[0-9]+$ ]] || [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "::error::Xcode major version '${XCODE_MAJOR}' is below 26."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install npm 10
        run: npm install -g npm@10

      - name: Check required secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID ASC_ISSUER_ID ASC_KEY_ID ASC_API_KEY_P8_BASE64 VITE_MAPBOX_TOKEN VITE_FIREBASE_APPCHECK_SITE_KEY VITE_SENTRY_DSN VITE_FIREBASE_VAPID_KEY; do
            if [ -n "$(printenv "${name}" 2>/dev/null || true)" ]; then
              echo "${name}: PRESENT"
            else
              echo "${name}: MISSING"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::One or more required secrets are missing."
            exit 1
          fi

      - name: Install dependencies and typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          if [ -n "$(git status --short --untracked-files=no)" ]; then
            echo "::error::npm ci or typecheck changed tracked files."
            git status --short --untracked-files=no
            exit 1
          fi

      - name: Build production web assets
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          SENTRY_AUTH_TOKEN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          echo "dist/index.html: PRESENT"

      - name: Copy web assets into the iOS shell
        shell: bash
        run: |
          set -euo pipefail
          npx cap copy ios
          test -d ios/App/App/public
          test -f ios/App/App/public/index.html
          test -f ios/App/App/capacitor.config.json
          test -f ios/App/App/config.xml
          tracked="$(git status --short --untracked-files=no)"
          if [ -n "${tracked}" ]; then
            echo "::error::cap copy changed tracked files."
            printf '%s\n' "${tracked}"
            exit 1
          fi
          echo "Capacitor iOS inputs: PRESENT"
          echo "tracked mutations: NONE"

      - name: Reconstruct App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, re, sys
          raw = re.sub(r"\s+", "", os.environ.get("ASC_API_KEY_P8_BASE64", ""))
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception:
              print("private key decode: FAIL")
              sys.exit(1)
          if not data.startswith(b"-----BEGIN ") or b"PRIVATE KEY-----" not in data.splitlines()[0]:
              print("private key decode: FAIL")
              sys.exit(1)
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "AuthKey.p8"
          path.write_bytes(data)
          path.chmod(0o600)
          print("private key decode: PASS")
          PY
          mode="$(stat -f '%Lp' "${RUNNER_TEMP}/AuthKey.p8")"
          if [ "${mode}" != "600" ]; then
            echo "private key mode: FAIL"
            exit 1
          fi
          echo "private key mode: 600"
          if ! openssl pkey -in "${RUNNER_TEMP}/AuthKey.p8" -noout >/dev/null 2>"${RUNNER_TEMP}/pkey.err"; then
            rm -f "${RUNNER_TEMP}/pkey.err"
            echo "private key validation: FAIL"
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/pkey.err"
          echo "private key validation: PASS"

      - name: Archive iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/archive.log"
          set +e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/ParQueen.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/AuthKey.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            archive >"${LOG}" 2>&1
          status=$?
          set -e
          python3 - "${LOG}" <<'PY'
          import pathlib, sys, os
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(errors="replace")
          for name in ("APPLE_TEAM_ID", "ASC_ISSUER_ID", "ASC_KEY_ID", "ASC_API_KEY_P8_BASE64"):
              value = os.environ.get(name) or ""
              if len(value) >= 6:
                  text = text.replace(value, "[REDACTED]")
          path.write_text(text)
          PY
          if [ "${status}" -ne 0 ]; then
            echo "::error::Archive failed."
            LOG="${LOG}" python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ["LOG"]).read_text(errors="replace").splitlines()
          idx = None
          for i, line in enumerate(lines):
              if re.search(r"error:|fatal error:|xcodebuild: error:|No profiles|requires a development team|Provisioning profile|Code Sign error|errSec", line):
                  idx = i
                  break
          if idx is None:
              print("No classified signing error line. Last 40 redacted log lines:")
              print("\n".join(lines[-40:]))
          else:
              start = max(0, idx - 5)
              end = min(len(lines), idx + 16)
              print(f"First meaningful error at log line {idx + 1}")
              print("\n".join(lines[start:end]))
          PY
            exit "${status}"
          fi
          test -d "${RUNNER_TEMP}/ParQueen.xcarchive"
          echo "archive: PASS"

      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          import xml.sax.saxutils as xml
          team = xml.escape(os.environ["APPLE_TEAM_ID"])
          plist = f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>{team}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          """
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          path.write_text(plist.strip() + "\n")
          PY
          plutil -lint "${RUNNER_TEMP}/ExportOptions.plist"
          LOG="${RUNNER_TEMP}/export.log"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/ParQueen.xcarchive" \
            -exportPath "${RUNNER_TEMP}/ipa-export" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/AuthKey.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            >"${LOG}" 2>&1
          status=$?
          set -e
          python3 - "${LOG}" <<'PY'
          import pathlib, sys, os
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(errors="replace")
          for name in ("APPLE_TEAM_ID", "ASC_ISSUER_ID", "ASC_KEY_ID", "ASC_API_KEY_P8_BASE64"):
              value = os.environ.get(name) or ""
              if len(value) >= 6:
                  text = text.replace(value, "[REDACTED]")
          path.write_text(text)
          PY
          if [ "${status}" -ne 0 ]; then
            echo "::error::Export failed."
            LOG="${LOG}" python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ["LOG"]).read_text(errors="replace").splitlines()
          idx = None
          for i, line in enumerate(lines):
              if re.search(r"error:|fatal error:|xcodebuild: error:|No profiles|requires a development team|Provisioning profile|Code Sign error|errSec|exportArchive", line):
                  idx = i
                  break
          if idx is None:
              print("No classified export error line. Last 40 redacted log lines:")
              print("\n".join(lines[-40:]))
          else:
              start = max(0, idx - 5)
              end = min(len(lines), idx + 16)
              print(f"First meaningful error at log line {idx + 1}")
              print("\n".join(lines[start:end]))
          PY
            exit "${status}"
          fi
          echo "export: PASS"

      - name: Verify signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, re, subprocess, sys
          export = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-export"
          ipas = sorted(export.rglob("*.ipa"))
          if len(ipas) != 1:
              print(f"ipa count: {len(ipas)}")
              sys.exit(1)
          ipa = ipas[0]
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          print(f"ipa filename: {ipa.name}")
          print(f"ipa bytes: {ipa.stat().st_size}")
          print(f"ipa sha256: {digest}")
          unpack = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-unpacked"
          unpack.mkdir(parents=True, exist_ok=True)
          subprocess.run(["ditto", "-x", "-k", str(ipa), str(unpack)], check=True)
          apps = [p for p in unpack.rglob("*.app") if p.is_dir()]
          if len(apps) != 1:
              print(f"app bundle count: {len(apps)}")
              sys.exit(1)
          app = apps[0]
          info = plistlib.loads((app / "Info.plist").read_bytes())
          expected = {
              "CFBundleIdentifier": "app.parqueen",
              "CFBundleShortVersionString": "1.0",
              "CFBundleVersion": "1",
              "CFBundleDisplayName": "ParQueen",
          }
          failed = False
          for key, want in expected.items():
              got = info.get(key)
              if got == want:
                  print(f"{key}: PASS")
              else:
                  print(f"{key}: FAIL")
                  failed = True
          verify = subprocess.run(["codesign", "--verify", "--deep", "--strict", str(app)], capture_output=True)
          print("codesign verification: PASS" if verify.returncode == 0 else "codesign verification: FAIL")
          if verify.returncode != 0:
              failed = True
          ent = subprocess.run(
              ["codesign", "-d", "--entitlements", ":-", str(app)],
              capture_output=True,
          )
          if ent.returncode != 0 or not ent.stdout.strip():
              print("entitlements: FAIL")
              sys.exit(1)
          entitlements = plistlib.loads(ent.stdout)
          if any("aps-environment" in key for key in entitlements):
              print("aps-environment: PRESENT")
              sys.exit(1)
          print("aps-environment: ABSENT")
          allowed = {
              "application-identifier",
              "com.apple.developer.team-identifier",
              "keychain-access-groups",
              "beta-reports-active",
          }
          unexpected = sorted(key for key in entitlements if key not in allowed)
          if unexpected:
              for key in unexpected:
                  print(f"unexpected entitlement: {key}")
              sys.exit(1)
          for key in sorted(entitlements):
              print(f"entitlement: {key}")
          team = os.environ["APPLE_TEAM_ID"]
          ident = entitlements.get("application-identifier")
          team_ent = entitlements.get("com.apple.developer.team-identifier")
          if ident == f"{team}.app.parqueen" and team_ent == team:
              print("team identifier: MATCH")
          else:
              print("team identifier: MISMATCH")
              failed = True
          public = app / "public"
          if not public.is_dir() or not (public / "index.html").is_file():
              print("production web bundle: ABSENT")
              sys.exit(1)
          chunks = []
          for path in public.rglob("*"):
              if path.is_file() and path.suffix.lower() in {".js", ".html", ".css", ".json"}:
                  chunks.append(path.read_text(errors="replace"))
          text = "\n".join(chunks)
          mapbox = re.search(r"pk\.[A-Za-z0-9_-]{20,}", text) is not None
          app_check = re.search(r"6L[A-Za-z0-9_-]{20,}", text) is not None
          sentry = re.search(r"https://[A-Za-z0-9]+@[A-Za-z0-9.-]+\.sentry\.io/[0-9]+", text) is not None
          debug = ("VITE_APPCHECK_DEBUG_TOKEN" in text) or ("FIREBASE_APPCHECK_DEBUG_TOKEN" in text)
          print(f"Mapbox configuration embedded: {'YES' if mapbox else 'NO'}")
          print(f"App Check production configuration embedded: {'YES' if app_check else 'NO'}")
          print(f"Sentry runtime DSN embedded: {'YES' if sentry else 'NO'}")
          print(f"debug App Check token embedded: {'YES' if debug else 'NO'}")
          if not mapbox or not app_check or not sentry or debug:
              failed = True
          if failed:
              sys.exit(1)
          print("ipa verification: PASS")
          PY

      - name: Delete signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "${RUNNER_TEMP}/AuthKey.p8" \
            "${RUNNER_TEMP}/ExportOptions.plist" \
            "${RUNNER_TEMP}/archive.log" \
            "${RUNNER_TEMP}/export.log" \
            "${RUNNER_TEMP}/pkey.err"
          rm -rf \
            "${RUNNER_TEMP}/ParQueen.xcarchive" \
            "${RUNNER_TEMP}/ipa-export" \
            "${RUNNER_TEMP}/ipa-unpacked"
          if [ -e "${RUNNER_TEMP}/AuthKey.p8" ]; then
            echo "AuthKey.p8: STILL PRESENT"
            exit 1
          fi
          echo "AuthKey.p8: ABSENT"
