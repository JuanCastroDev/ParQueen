name: iOS Signed Archive

# Stage C2. The signing job is manual and main-only.
# Pull requests run the contract job and a secret-free ad-hoc archive probe.
# They do not export, and they do not receive Apple or production build secret values.

on:
  pull_request:
    paths:
      - .github/workflows/ios-signed-archive.yml
      - docs/IOS_SIGNED_ARCHIVE.md
      - ios/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - vite.config.ts
      - productionBuildConfig.ts
      - firebaseConfig.ts
      - index.tsx
      - sentryRelease.ts
      - utils/appCheck.ts
      - utils/appCheckPlatform.ts
      - utils/browserCredentials.ts
      - utils/sentryInit.ts
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirmation required to archive on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: signing contract
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: macOS and Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          echo "Selected Xcode version: ${XCODE_VERSION}"
          if ! [[ "${XCODE_MAJOR}" =~ ^[0-9]+$ ]] || [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "::error::Xcode major version '${XCODE_MAJOR}' is below 26."
            exit 1
          fi

      - name: Assert Release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          test -f "${PBX}"
          BUNDLES="$(grep "PRODUCT_BUNDLE_IDENTIFIER = " "${PBX}" | sed -E 's/.*PRODUCT_BUNDLE_IDENTIFIER = //; s/;//g; s/[[:space:]]//g' | sort -u)"
          if [ "${BUNDLES}" != "app.parqueen" ]; then
            echo "::error::PRODUCT_BUNDLE_IDENTIFIER is not exactly app.parqueen."
            exit 1
          fi
          for setting in "MARKETING_VERSION = 1.0;" "CURRENT_PROJECT_VERSION = 5;" "IPHONEOS_DEPLOYMENT_TARGET = 15.0;" "CODE_SIGN_STYLE = Automatic;"; do
            if ! grep -F -q "${setting}" "${PBX}"; then
              echo "::error::Missing expected project setting: ${setting}"
              exit 1
            fi
          done
          if grep -R -n "DEVELOPMENT_TEAM" ios --include='*.pbxproj' --include='*.xcconfig' --include='*.plist'; then
            echo "::error::DEVELOPMENT_TEAM must stay unset in source."
            exit 1
          fi
          if grep -R -n "PROVISIONING_PROFILE" ios --include='*.pbxproj' --include='*.xcconfig' --include='*.plist'; then
            echo "::error::A provisioning profile setting is present."
            exit 1
          fi
          test -f ios/App/App/App.entitlements
          test -f ios/App/App/AppDebug.entitlements
          if ! grep -q '<string>production</string>' ios/App/App/App.entitlements; then
            echo "::error::Release entitlements must set aps-environment to production."
            exit 1
          fi
          if ! grep -q '<string>development</string>' ios/App/App/AppDebug.entitlements; then
            echo "::error::Debug entitlements must set aps-environment to development."
            exit 1
          fi
          if ! grep -q 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' "${PBX}"; then
            echo "::error::Release CODE_SIGN_ENTITLEMENTS is missing."
            exit 1
          fi
          if ! grep -q 'CODE_SIGN_ENTITLEMENTS = App/AppDebug.entitlements;' "${PBX}"; then
            echo "::error::Debug CODE_SIGN_ENTITLEMENTS is missing."
            exit 1
          fi
          echo "Release signing configuration matches the unsigned baseline."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install npm 10
        run: npm install -g npm@10

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Confirm scheme App
        shell: bash
        run: |
          set -euo pipefail
          LIST="${RUNNER_TEMP}/xcodebuild-list.txt"
          xcodebuild -list -project ios/App/App.xcodeproj > "${LIST}"
          SCHEMES="$(awk '/^[[:space:]]*Schemes:/{flag=1;next} flag && /^[[:space:]]*$/{exit} flag' "${LIST}")"
          printf '%s\n' "${SCHEMES}"
          if ! printf '%s\n' "${SCHEMES}" | grep -E -q '^[[:space:]]+App$'; then
            echo "::error::Scheme App was not listed."
            exit 1
          fi

      - name: Assert workflow security contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(".github/workflows/ios-signed-archive.yml").read_text().replace("\r\n", "\n")
          forbidden = [
              "al" + "tool",
              "notary" + "tool",
              "destination=" + "upload",
              "-upload" + "App",
              "upload-" + "artifact",
              "pull_request" + "_target",
              "set " + "-x",
          ]
          for needle in forbidden:
              if needle in text:
                  print(f"forbidden workflow token: {needle}")
                  sys.exit(1)
          if ("contents: " + "write") in text:
              print("workflow requests contents write")
              sys.exit(1)
          if not re.search(r"(?m)^permissions:\n  contents: read\s*$", text):
              print("workflow permissions are not contents read")
              sys.exit(1)
          required = [
              "workflow_dispatch",
              "SIGN_PARQUEEN",
              "refs/heads/main",
              "app-store-connect",
              "macos-26",
              "app.parqueen",
              "-allowProvisioningUpdates",
              "-authenticationKeyPath",
              "-authenticationKeyID",
              "-authenticationKeyIssuerID",
              'DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"',
              "CODE_SIGN_IDENTITY=-",
              "AD_HOC_CODE_SIGNING_ALLOWED=YES",
              "CODE_SIGN_STYLE=Automatic",
              "manageAppVersionAndBuildNumber",
          ]
          secret_ref = "secrets" + "."
          for needle in required:
              if needle not in text:
                  print(f"missing workflow contract text: {needle}")
                  sys.exit(1)
          if secret_ref + "APPLE_TEAM_ID" not in text:
              print("missing workflow contract text: Apple team secret reference")
              sys.exit(1)
          if re.search(r"DEVELOPMENT_TEAM=[A-Z0-9]{10}([^A-Z0-9]|$)", text):
              print("workflow contains a literal Team ID")
              sys.exit(1)
          parts = text.split("\n  signed-archive:\n", 1)
          if len(parts) != 2:
              print("signed-archive job was not found")
              sys.exit(1)
          before, signed = parts
          if secret_ref in before:
              print("secrets are referenced outside the signed job")
              sys.exit(1)
          for needle in (
              "github.event_name == 'workflow_dispatch'",
              "github.ref == 'refs/heads/main'",
              "needs.dispatch-guard.result == 'success'",
          ):
              if needle not in signed.split("\n    steps:", 1)[0]:
                  print(f"signed job guard missing: {needle}")
                  sys.exit(1)
          archive_parts = signed.split("- name: Archive iOS app", 1)
          if len(archive_parts) != 2:
              print("archive step was not found")
              sys.exit(1)
          archive_body = archive_parts[1].split("- name: Export signed IPA", 1)[0]
          for needle in (
              "CODE_SIGN_IDENTITY=-",
              "AD_HOC_CODE_SIGNING_ALLOWED=YES",
              "CODE_SIGN_STYLE=Automatic",
              'DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"',
          ):
              if needle not in archive_body:
                  print("archive command missing ad-hoc signing setting")
                  sys.exit(1)
          for needle in (
              "-allowProvisioningUpdates",
              "-authenticationKeyPath",
              "-authenticationKeyID",
              "-authenticationKeyIssuerID",
          ):
              if needle in archive_body:
                  print("archive command still requests Apple provisioning")
                  sys.exit(1)
          forced_identity = "CODE_SIGN_IDENTITY=\"" + "Apple " + "Distribution\""
          dev_identity = "CODE_SIGN_IDENTITY=\"" + "iPhone " + "Developer\""
          apple_development = "Apple " + "Development"
          if forced_identity in archive_body or dev_identity in archive_body or apple_development in archive_body:
              print("archive command still forces a provisioning identity")
              sys.exit(1)
          if "PROVISIONING_PROFILE" in archive_body:
              print("archive command sets a provisioning profile")
              sys.exit(1)
          export_parts = signed.split("- name: Export signed IPA", 1)
          if len(export_parts) != 2:
              print("export step was not found")
              sys.exit(1)
          export_body = export_parts[1].split("- name: Verify signed IPA", 1)[0]
          for needle in (
              "-allowProvisioningUpdates",
              "-authenticationKeyPath",
              "-authenticationKeyID",
              "-authenticationKeyIssuerID",
              "app-store-connect",
          ):
              if needle not in export_body:
                  print("export command missing distribution authentication")
                  sys.exit(1)
          probe_name = "- name: Ad-hoc " + "Release archive probe"
          verify_name = "- name: Verify ad-hoc " + "archive contents"
          probe_parts = before.split(probe_name, 1)
          if len(probe_parts) != 2:
              print("ad-hoc archive probe was not found")
              sys.exit(1)
          probe_body = probe_parts[1].split(verify_name, 1)[0]
          for needle in (
              "CODE_SIGN_IDENTITY=-",
              "AD_HOC_CODE_SIGNING_ALLOWED=YES",
              "CODE_SIGN_STYLE=Automatic",
              "-configuration Release",
              "-destination 'generic/platform=iOS'",
              "ParQueen-AdHoc-Probe.xcarchive",
          ):
              if needle not in probe_body:
                  print("ad-hoc archive probe is incomplete")
                  sys.exit(1)
          if secret_ref in probe_body or "DEVELOPMENT_TEAM" in probe_body:
              print("ad-hoc archive probe uses signing credentials")
              sys.exit(1)
          for needle in (
              "-allowProvisioningUpdates",
              "-authenticationKeyPath",
              "-authenticationKeyID",
              "-authenticationKeyIssuerID",
              forced_identity,
              dev_identity,
              apple_development,
              "PROVISIONING_PROFILE",
          ):
              if needle in probe_body:
                  print("ad-hoc archive probe requests provisioning")
                  sys.exit(1)
          guard = before.split("\n  dispatch-guard:\n", 1)
          if len(guard) != 2 or "SIGN_PARQUEEN" not in guard[1] or "refs/heads/main" not in guard[1]:
              print("dispatch guard does not require main and the confirmation phrase")
              sys.exit(1)
          if secret_ref in guard[1]:
              print("dispatch guard references secrets")
              sys.exit(1)
          ipa_parts = signed.split("- name: Verify signed IPA", 1)
          if len(ipa_parts) != 2:
              print("ipa verifier was not found")
              sys.exit(1)
          ipa_body = ipa_parts[1].split("- name: Delete signing material", 1)[0]
          for needle in (
              'entitlements.get("get-task-allow")',
              "get-task-allow: ABSENT",
              "get-task-allow: FALSE — DISTRIBUTION SAFE",
              "get-task-allow: TRUE — FAIL",
              "embedded.mobileprovision",
              '"security", "cms", "-D"',
              "application-identifier",
              "com.apple.developer.team-identifier",
              "keychain-access-groups",
              "beta-reports-active",
              "team identifier: MATCH",
              "production web bundle: ABSENT",
              "Mapbox configuration embedded:",
              "App Check production configuration embedded:",
              "Sentry runtime DSN embedded:",
              "VITE App Check debug identifier:",
              "Firebase App Check debug assignment:",
              "known App Check debug bypass marker:",
              "debug App Check token wiring: ABSENT",
              "privacy purpose NSCameraUsageDescription: PASS",
              "privacy purpose NSCameraUsageDescription: FAIL",
              "export compliance ITSAppUsesNonExemptEncryption: FALSE",
              "export compliance ITSAppUsesNonExemptEncryption: FAIL",
              "obsolete camera plugin artifacts: ABSENT",
              "aps-environment: production",
              "UIBackgroundModes: fetch",
              "UIBackgroundModes: remote-notification",
              "FIREBASE_APPCHECK_DEBUG_TOKEN\\s*=(?!=)",
              "appcheck-debug-",
          ):
              if needle not in ipa_body:
                  print("ipa verifier is missing a required check")
                  sys.exit(1)
          classify_name = "- name: Test " + "get-task-allow classification"
          classify_parts = before.split(classify_name, 1)
          if len(classify_parts) != 2:
              print("get-task-allow classification test was not found")
              sys.exit(1)
          classify_body = classify_parts[1].split("- name: Prepare CI-only web assets", 1)[0]
          for needle in (
              '({}, "pass")',
              '({"get-task-allow": False}, "pass")',
              '({"get-task-allow": True}, "fail")',
              '({"get-task-allow": "false"}, "fail")',
          ):
              if needle not in classify_body:
                  print("get-task-allow classification test is incomplete")
                  sys.exit(1)
          if secret_ref in classify_body:
              print("get-task-allow classification test references secrets")
              sys.exit(1)
          bare_firebase = '("FIREBASE_APPCHECK_DEBUG_TOKEN" in text)'
          if bare_firebase in ipa_body:
              print("ipa verifier still treats a passive Firebase debug identifier as a leak")
              sys.exit(1)
          if "npx vitest run utils/appCheckBundleAssertion.test.ts" not in signed:
              print("production App Check bundle assertion is missing")
              sys.exit(1)
          debug_name = "- name: Test App Check " + "debug-token classification"
          debug_parts = before.split(debug_name, 1)
          if len(debug_parts) != 2:
              print("debug-token classification test was not found")
              sys.exit(1)
          debug_body = debug_parts[1].split("- name: Prepare CI-only web assets", 1)[0]
          for needle in (
              '("", "pass")',
              "n.resolve(t.FIREBASE_APPCHECK_DEBUG_TOKEN)",
              'typeof t.FIREBASE_APPCHECK_DEBUG_TOKEN == "string"',
              "t.FIREBASE_APPCHECK_DEBUG_TOKEN !== true",
              '"VITE_APPCHECK_DEBUG_TOKEN", "fail"',
              "FIREBASE_APPCHECK_DEBUG_TOKEN=true",
              'self.FIREBASE_APPCHECK_DEBUG_TOKEN="abc"',
              "x.FIREBASE_APPCHECK_DEBUG_TOKEN=n",
              "appcheck-debug-token",
              "FIREBASE_APPCHECK_DEBUG_TOKEN\\s*=(?!=)",
          ):
              if needle not in debug_body:
                  print("debug-token classification test is incomplete")
                  sys.exit(1)
          if secret_ref in debug_body:
              print("debug-token classification test references secrets")
              sys.exit(1)
          print("workflow security contract: PASS")
          PY

      - name: Test get-task-allow classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          def classify_get_task_allow(entitlements):
              if "get-task-allow" not in entitlements:
                  return "pass", "get-task-allow: ABSENT"
              value = entitlements.get("get-task-allow")
              if value is False:
                  return "pass", "get-task-allow: FALSE — DISTRIBUTION SAFE"
              if value is True:
                  return "fail", "get-task-allow: TRUE — FAIL"
              return "fail", "get-task-allow: INVALID — FAIL"

          cases = [
              ({}, "pass"),
              ({"get-task-allow": False}, "pass"),
              ({"get-task-allow": True}, "fail"),
              ({"get-task-allow": "false"}, "fail"),
          ]
          for entitlements, want in cases:
              got, message = classify_get_task_allow(entitlements)
              print(message)
              if got != want:
                  print("get-task-allow classification: FAIL")
                  sys.exit(1)
          print("get-task-allow classification: PASS")
          PY

      - name: Test App Check debug-token classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys

          def classify_debug_wiring(text):
              vite = "VITE_APPCHECK_DEBUG_TOKEN" in text
              assigned = re.search(r"FIREBASE_APPCHECK_DEBUG_TOKEN\s*=(?!=)", text) is not None
              prop = re.search(r"\.FIREBASE_APPCHECK_DEBUG_TOKEN\s*=(?!=)", text) is not None
              bypass = re.search(r"appcheck-debug-", text, re.IGNORECASE) is not None
              return "fail" if (vite or assigned or prop or bypass) else "pass"

          cases = [
              ("", "pass"),
              ("n.resolve(t.FIREBASE_APPCHECK_DEBUG_TOKEN)", "pass"),
              ('typeof t.FIREBASE_APPCHECK_DEBUG_TOKEN == "string"', "pass"),
              ("t.FIREBASE_APPCHECK_DEBUG_TOKEN !== true", "pass"),
              ("VITE_APPCHECK_DEBUG_TOKEN", "fail"),
              ("FIREBASE_APPCHECK_DEBUG_TOKEN=true", "fail"),
              ('self.FIREBASE_APPCHECK_DEBUG_TOKEN="abc"', "fail"),
              ("x.FIREBASE_APPCHECK_DEBUG_TOKEN=n", "fail"),
              ("appcheck-debug-token", "fail"),
          ]
          for sample, want in cases:
              got = classify_debug_wiring(sample)
              if got != want:
                  print("debug-token classification: FAIL")
                  sys.exit(1)
          print("debug-token classification: PASS")
          PY

      - name: Prepare CI-only web assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Creating a minimal CI-only webDir for the ad-hoc archive probe."
          echo "This is not a production Vite build and uses no production environment values."
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>ParQueen Stage A</title></head>
          <body>Stage A native shell proof</body>
          </html>
          HTML
          npx cap copy ios
          missing=0
          for path in ios/App/App/public/index.html ios/App/App/capacitor.config.json ios/App/App/config.xml; do
            if [ -f "${path}" ]; then
              echo "PRESENT ${path}"
            else
              echo "ABSENT ${path}"
              missing=1
            fi
          done
          if [ ! -d ios/App/App/public ]; then
            echo "ABSENT ios/App/App/public"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::error::npx cap copy ios did not produce the Xcode resource inputs."
            exit 1
          fi
          tracked="$(git status --short --untracked-files=no)"
          if [ -n "${tracked}" ]; then
            echo "::error::cap copy changed tracked files."
            printf '%s\n' "${tracked}"
            exit 1
          fi
          echo "tracked mutations: NONE"

      - name: Ad-hoc Release archive probe
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/adhoc-archive.log"
          set +e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/ParQueen-AdHoc-Probe.xcarchive" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            archive >"${LOG}" 2>&1
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "::error::Ad-hoc archive probe failed."
            LOG="${LOG}" python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ["LOG"]).read_text(errors="replace").splitlines()
          idx = None
          for i, line in enumerate(lines):
              if re.search(r"error:|fatal error:|xcodebuild: error:|No profiles|Provisioning profile|Code Sign error|errSec|conflicting provisioning", line):
                  idx = i
                  break
          if idx is None:
              print("No classified archive error line. Last 40 log lines:")
              print("\n".join(lines[-40:]))
          else:
              start = max(0, idx - 5)
              end = min(len(lines), idx + 16)
              print(f"First meaningful error at log line {idx + 1}")
              print("\n".join(lines[start:end]))
          PY
            exit "${status}"
          fi
          test -d "${RUNNER_TEMP}/ParQueen-AdHoc-Probe.xcarchive"
          echo "ad-hoc archive: PASS"

      - name: Verify ad-hoc archive contents
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/ParQueen-AdHoc-Probe.xcarchive"
          APP="${ARCHIVE}/Products/Applications/App.app"
          test -d "${ARCHIVE}"
          echo "xcarchive: PRESENT"
          test -d "${APP}"
          echo "App.app: PRESENT"
          IDENT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP}/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${APP}/Info.plist")"
          echo "bundle id: ${IDENT}"
          echo "version: ${VERSION}"
          echo "build: ${BUILD}"
          test "${IDENT}" = "app.parqueen"
          test "${VERSION}" = "1.0"
          test "${BUILD}" = "5"
          echo "ad-hoc archive probe: PASS"

  dispatch-guard:
    name: dispatch guard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and confirmation
        env:
          REF_NAME: ${{ github.ref }}
          CONFIRM_TEXT: ${{ github.event.inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${REF_NAME}" = "refs/heads/main" ] && [ "${CONFIRM_TEXT}" = "SIGN_PARQUEEN" ]; then
            echo "dispatch guard: accepted"
            exit 0
          fi
          echo "dispatch guard: rejected"
          exit 1

  signed-archive:
    name: signed archive
    needs: [contract, dispatch-guard]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.dispatch-guard.result == 'success'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: macOS and Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          echo "Selected Xcode version: ${XCODE_VERSION}"
          if ! [[ "${XCODE_MAJOR}" =~ ^[0-9]+$ ]] || [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "::error::Xcode major version '${XCODE_MAJOR}' is below 26."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install npm 10
        run: npm install -g npm@10

      - name: Check required secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          IOS_FIREBASE_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_FIREBASE_GOOGLE_SERVICE_INFO_PLIST_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID ASC_ISSUER_ID ASC_KEY_ID ASC_API_KEY_P8_BASE64 VITE_MAPBOX_TOKEN VITE_FIREBASE_APPCHECK_SITE_KEY VITE_SENTRY_DSN VITE_FIREBASE_VAPID_KEY IOS_FIREBASE_GOOGLE_SERVICE_INFO_PLIST_B64; do
            if [ -n "$(printenv "${name}" 2>/dev/null || true)" ]; then
              echo "${name}: PRESENT"
            else
              echo "${name}: MISSING"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::One or more required secrets are missing."
            exit 1
          fi

      - name: Install dependencies and typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          if [ -n "$(git status --short --untracked-files=no)" ]; then
            echo "::error::npm ci or typecheck changed tracked files."
            git status --short --untracked-files=no
            exit 1
          fi

      - name: Build production web assets
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          SENTRY_AUTH_TOKEN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          echo "dist/index.html: PRESENT"

      - name: Assert production App Check bundle
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run utils/appCheckBundleAssertion.test.ts

      - name: Copy web assets into the iOS shell
        shell: bash
        run: |
          set -euo pipefail
          npx cap copy ios
          test -d ios/App/App/public
          test -f ios/App/App/public/index.html
          test -f ios/App/App/capacitor.config.json
          test -f ios/App/App/config.xml
          tracked="$(git status --short --untracked-files=no)"
          if [ -n "${tracked}" ]; then
            echo "::error::cap copy changed tracked files."
            printf '%s\n' "${tracked}"
            exit 1
          fi
          echo "Capacitor iOS inputs: PRESENT"
          echo "tracked mutations: NONE"

      - name: Reconstruct App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, re, sys
          raw = re.sub(r"\s+", "", os.environ.get("ASC_API_KEY_P8_BASE64", ""))
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception:
              print("private key decode: FAIL")
              sys.exit(1)
          if not data.startswith(b"-----BEGIN ") or b"PRIVATE KEY-----" not in data.splitlines()[0]:
              print("private key decode: FAIL")
              sys.exit(1)
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "AuthKey.p8"
          path.write_bytes(data)
          path.chmod(0o600)
          print("private key decode: PASS")
          PY
          mode="$(stat -f '%Lp' "${RUNNER_TEMP}/AuthKey.p8")"
          if [ "${mode}" != "600" ]; then
            echo "private key mode: FAIL"
            exit 1
          fi
          echo "private key mode: 600"
          if ! openssl pkey -in "${RUNNER_TEMP}/AuthKey.p8" -noout >/dev/null 2>"${RUNNER_TEMP}/pkey.err"; then
            rm -f "${RUNNER_TEMP}/pkey.err"
            echo "private key validation: FAIL"
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/pkey.err"
          echo "private key validation: PASS"

      - name: Materialize GoogleService-Info.plist
        env:
          IOS_FIREBASE_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_FIREBASE_GOOGLE_SERVICE_INFO_PLIST_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import plistlib
          from pathlib import Path

          value = os.environ.get("IOS_FIREBASE_GOOGLE_SERVICE_INFO_PLIST_B64")
          if not value:
              raise SystemExit("missing IOS_FIREBASE_GOOGLE_SERVICE_INFO_PLIST_B64")

          target = Path("ios/App/App/GoogleService-Info.plist")
          target.write_bytes(base64.b64decode(value, validate=True))
          parsed = plistlib.loads(target.read_bytes())
          if parsed.get("BUNDLE_ID") != "app.parqueen":
              raise SystemExit("GoogleService-Info.plist BUNDLE_ID mismatch")
          if parsed.get("GOOGLE_APP_ID") != "1:768131391875:ios:1356ad05455bd17a3196b6":
              raise SystemExit("GoogleService-Info.plist GOOGLE_APP_ID mismatch")
          print("GoogleService-Info.plist: PRESENT")
          print("BUNDLE_ID: MATCH")
          print("GOOGLE_APP_ID: MATCH")
          PY

      - name: Archive iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/archive.log"
          set +e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/ParQueen.xcarchive" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            archive >"${LOG}" 2>&1
          status=$?
          set -e
          python3 - "${LOG}" <<'PY'
          import pathlib, sys, os
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(errors="replace")
          for name in ("APPLE_TEAM_ID", "ASC_ISSUER_ID", "ASC_KEY_ID", "ASC_API_KEY_P8_BASE64"):
              value = os.environ.get(name) or ""
              if len(value) >= 6:
                  text = text.replace(value, "[REDACTED]")
          path.write_text(text)
          PY
          if [ "${status}" -ne 0 ]; then
            echo "::error::Archive failed."
            LOG="${LOG}" python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ["LOG"]).read_text(errors="replace").splitlines()
          idx = None
          for i, line in enumerate(lines):
              if re.search(r"error:|fatal error:|xcodebuild: error:|No profiles|requires a development team|Provisioning profile|Code Sign error|errSec", line):
                  idx = i
                  break
          if idx is None:
              print("No classified signing error line. Last 40 redacted log lines:")
              print("\n".join(lines[-40:]))
          else:
              start = max(0, idx - 5)
              end = min(len(lines), idx + 16)
              print(f"First meaningful error at log line {idx + 1}")
              print("\n".join(lines[start:end]))
          PY
            exit "${status}"
          fi
          test -d "${RUNNER_TEMP}/ParQueen.xcarchive"
          echo "archive: PASS"

      - name: Export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          import xml.sax.saxutils as xml
          team = xml.escape(os.environ["APPLE_TEAM_ID"])
          plist = f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>{team}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          """
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          path.write_text(plist.strip() + "\n")
          PY
          plutil -lint "${RUNNER_TEMP}/ExportOptions.plist"
          LOG="${RUNNER_TEMP}/export.log"
          set +e
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/ParQueen.xcarchive" \
            -exportPath "${RUNNER_TEMP}/ipa-export" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/AuthKey.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            >"${LOG}" 2>&1
          status=$?
          set -e
          python3 - "${LOG}" <<'PY'
          import pathlib, sys, os
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(errors="replace")
          for name in ("APPLE_TEAM_ID", "ASC_ISSUER_ID", "ASC_KEY_ID", "ASC_API_KEY_P8_BASE64"):
              value = os.environ.get(name) or ""
              if len(value) >= 6:
                  text = text.replace(value, "[REDACTED]")
          path.write_text(text)
          PY
          if [ "${status}" -ne 0 ]; then
            echo "::error::Export failed."
            LOG="${LOG}" python3 - <<'PY'
          import os, re
          from pathlib import Path
          lines = Path(os.environ["LOG"]).read_text(errors="replace").splitlines()
          idx = None
          for i, line in enumerate(lines):
              if re.search(r"error:|fatal error:|xcodebuild: error:|No profiles|requires a development team|Provisioning profile|Code Sign error|errSec|exportArchive", line):
                  idx = i
                  break
          if idx is None:
              print("No classified export error line. Last 40 redacted log lines:")
              print("\n".join(lines[-40:]))
          else:
              start = max(0, idx - 5)
              end = min(len(lines), idx + 16)
              print(f"First meaningful error at log line {idx + 1}")
              print("\n".join(lines[start:end]))
          PY
            exit "${status}"
          fi
          echo "export: PASS"

      - name: Verify signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, re, subprocess, sys
          from datetime import datetime, timezone
          export = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-export"
          ipas = sorted(export.rglob("*.ipa"))
          if len(ipas) != 1:
              print(f"ipa count: {len(ipas)}")
              sys.exit(1)
          ipa = ipas[0]
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          print(f"ipa filename: {ipa.name}")
          print(f"ipa bytes: {ipa.stat().st_size}")
          print(f"ipa sha256: {digest}")
          unpack = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-unpacked"
          unpack.mkdir(parents=True, exist_ok=True)
          subprocess.run(["ditto", "-x", "-k", str(ipa), str(unpack)], check=True)
          apps = [p for p in unpack.rglob("*.app") if p.is_dir()]
          if len(apps) != 1:
              print(f"app bundle count: {len(apps)}")
              sys.exit(1)
          app = apps[0]
          info = plistlib.loads((app / "Info.plist").read_bytes())
          expected = {
              "CFBundleIdentifier": "app.parqueen",
              "CFBundleShortVersionString": "1.0",
              "CFBundleVersion": "5",
              "CFBundleDisplayName": "ParQueen",
          }
          failed = False
          for key, want in expected.items():
              got = info.get(key)
              if got == want:
                  print(f"{key}: PASS")
              else:
                  print(f"{key}: FAIL")
                  failed = True
          camera_purpose = info.get("NSCameraUsageDescription")
          if isinstance(camera_purpose, str) and camera_purpose.strip():
              print("privacy purpose NSCameraUsageDescription: PASS")
          else:
              print("privacy purpose NSCameraUsageDescription: FAIL")
              failed = True
          if info.get("ITSAppUsesNonExemptEncryption") is False:
              print("export compliance ITSAppUsesNonExemptEncryption: FALSE")
          else:
              print("export compliance ITSAppUsesNonExemptEncryption: FAIL")
              failed = True
          for photo_key in ("NSPhotoLibraryUsageDescription", "NSPhotoLibraryAddUsageDescription"):
              if photo_key in info:
                  print(f"privacy purpose {photo_key}: PRESENT")
                  failed = True
              else:
                  print(f"privacy purpose {photo_key}: ABSENT")
          obsolete = []
          for artifact in app.rglob("*"):
              artifact_name = artifact.name
              for token in ("CapacitorCamera", "IONCameraLib"):
                  if artifact_name == token or artifact_name.startswith(token + "."):
                      obsolete.append(str(artifact.relative_to(app)))
                      break
          if obsolete:
              for hit in obsolete:
                  print(f"obsolete camera plugin artifact: {hit}")
              failed = True
          else:
              print("obsolete camera plugin artifacts: ABSENT")
          verify = subprocess.run(["codesign", "--verify", "--deep", "--strict", str(app)], capture_output=True)
          print("codesign verification: PASS" if verify.returncode == 0 else "codesign verification: FAIL")
          if verify.returncode != 0:
              failed = True
          ent = subprocess.run(
              ["codesign", "-d", "--entitlements", ":-", str(app)],
              capture_output=True,
          )
          if ent.returncode != 0 or not ent.stdout.strip():
              print("entitlements: FAIL")
              sys.exit(1)
          entitlements = plistlib.loads(ent.stdout)
          if entitlements.get("aps-environment") != "production":
              print("aps-environment: FAIL")
              sys.exit(1)
          print("aps-environment: production")
          background_modes = info.get("UIBackgroundModes")
          if (
              not isinstance(background_modes, list)
              or "fetch" not in background_modes
              or "remote-notification" not in background_modes
          ):
              print("UIBackgroundModes: FAIL")
              sys.exit(1)
          print("UIBackgroundModes: fetch")
          print("UIBackgroundModes: remote-notification")
          allowed = {
              "application-identifier",
              "com.apple.developer.team-identifier",
              "keychain-access-groups",
              "beta-reports-active",
              "get-task-allow",
              "aps-environment",
          }
          unexpected = sorted(key for key in entitlements if key not in allowed)
          if unexpected:
              for key in unexpected:
                  print(f"unexpected entitlement: {key}")
              sys.exit(1)
          if "get-task-allow" not in entitlements:
              print("get-task-allow: ABSENT")
          else:
              get_task_allow = entitlements.get("get-task-allow")
              if get_task_allow is False:
                  print("get-task-allow: FALSE — DISTRIBUTION SAFE")
              elif get_task_allow is True:
                  print("get-task-allow: TRUE — FAIL")
                  failed = True
              else:
                  print("get-task-allow: INVALID — FAIL")
                  failed = True
          for key in sorted(entitlements):
              print(f"entitlement: {key}")
          team = os.environ["APPLE_TEAM_ID"]
          ident = entitlements.get("application-identifier")
          team_ent = entitlements.get("com.apple.developer.team-identifier")
          if ident == f"{team}.app.parqueen" and team_ent == team:
              print("team identifier: MATCH")
          else:
              print("team identifier: MISMATCH")
              failed = True
          provision = app / "embedded.mobileprovision"
          decoded = pathlib.Path(os.environ["RUNNER_TEMP"]) / "embedded-profile.plist"
          try:
              if not provision.is_file():
                  print("embedded.mobileprovision: ABSENT")
                  failed = True
              else:
                  print("embedded.mobileprovision: PRESENT")
                  decode = subprocess.run(
                      ["security", "cms", "-D", "-i", str(provision), "-o", str(decoded)],
                      capture_output=True,
                  )
                  if decode.returncode != 0 or not decoded.is_file():
                      print("embedded profile decode: FAIL")
                      failed = True
                  else:
                      profile = plistlib.loads(decoded.read_bytes())
                      profile_ent = profile.get("Entitlements")
                      if not isinstance(profile_ent, dict):
                          print("embedded profile entitlements: FAIL")
                          failed = True
                          profile_ent = {}
                      app_id = profile_ent.get("application-identifier")
                      if app_id == f"{team}.app.parqueen":
                          print("profile application identifier: MATCH")
                      else:
                          print("profile application identifier: MISMATCH")
                          failed = True
                      teams = profile.get("TeamIdentifier")
                      if isinstance(teams, list) and team in teams:
                          print("profile team identifier: MATCH")
                      else:
                          print("profile team identifier: MISMATCH")
                          failed = True
                      if "get-task-allow" not in profile_ent:
                          print("profile get-task-allow: ABSENT")
                          failed = True
                      else:
                          profile_task_allow = profile_ent.get("get-task-allow")
                          if profile_task_allow is False:
                              print("profile get-task-allow: FALSE — DISTRIBUTION SAFE")
                          elif profile_task_allow is True:
                              print("profile get-task-allow: TRUE — FAIL")
                              failed = True
                          else:
                              print("profile get-task-allow: INVALID — FAIL")
                              failed = True
                      if "beta-reports-active" not in profile_ent:
                          print("profile beta-reports-active: ABSENT")
                      elif profile_ent.get("beta-reports-active") is True:
                          print("profile beta-reports-active: TRUE")
                      elif profile_ent.get("beta-reports-active") is False:
                          print("profile beta-reports-active: FALSE")
                      else:
                          print("profile beta-reports-active: INVALID")
                          failed = True
                      if "ProvisionedDevices" in profile:
                          print("profile type: development")
                          failed = True
                      else:
                          print("profile type: distribution")
                      expiration = profile.get("ExpirationDate")
                      if not isinstance(expiration, datetime):
                          print("profile expiration: ABSENT")
                          failed = True
                      else:
                          expiry = expiration if expiration.tzinfo else expiration.replace(tzinfo=timezone.utc)
                          print(f"profile expiration: {expiry.date().isoformat()}")
                          if expiry <= datetime.now(timezone.utc):
                              print("profile valid: NO")
                              failed = True
                          else:
                              print("profile valid: YES")
          finally:
              if decoded.exists():
                  decoded.unlink()
          public = app / "public"
          if not public.is_dir() or not (public / "index.html").is_file():
              print("production web bundle: ABSENT")
              sys.exit(1)
          chunks = []
          for path in public.rglob("*"):
              if path.is_file() and path.suffix.lower() in {".js", ".html", ".css", ".json"}:
                  chunks.append(path.read_text(errors="replace"))
          text = "\n".join(chunks)
          mapbox = re.search(r"pk\.[A-Za-z0-9_-]{20,}", text) is not None
          app_check = re.search(r"6L[A-Za-z0-9_-]{20,}", text) is not None
          sentry = re.search(r"https://[A-Za-z0-9]+@[A-Za-z0-9.-]+\.sentry\.io/[0-9]+", text) is not None
          vite_debug = "VITE_APPCHECK_DEBUG_TOKEN" in text
          firebase_assignment = re.search(
              r"FIREBASE_APPCHECK_DEBUG_TOKEN\s*=(?!=)",
              text,
          ) is not None or re.search(
              r"\.FIREBASE_APPCHECK_DEBUG_TOKEN\s*=(?!=)",
              text,
          ) is not None
          bypass = re.search(r"appcheck-debug-", text, re.IGNORECASE) is not None
          print(f"Mapbox configuration embedded: {'YES' if mapbox else 'NO'}")
          print(f"App Check production configuration embedded: {'YES' if app_check else 'NO'}")
          print(f"Sentry runtime DSN embedded: {'YES' if sentry else 'NO'}")
          print("VITE App Check debug identifier: " + ("PRESENT" if vite_debug else "ABSENT"))
          print("Firebase App Check debug assignment: " + ("PRESENT" if firebase_assignment else "ABSENT"))
          print("known App Check debug bypass marker: " + ("PRESENT" if bypass else "ABSENT"))
          if vite_debug or firebase_assignment or bypass:
              failed = True
          else:
              print("debug App Check token wiring: ABSENT")
          if not mapbox or not app_check or not sentry:
              failed = True
          if failed:
              sys.exit(1)
          print("ipa verification: PASS")
          PY

      - name: Delete signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f ios/App/App/GoogleService-Info.plist
          rm -f \
            "${RUNNER_TEMP}/AuthKey.p8" \
            "${RUNNER_TEMP}/ExportOptions.plist" \
            "${RUNNER_TEMP}/archive.log" \
            "${RUNNER_TEMP}/export.log" \
            "${RUNNER_TEMP}/pkey.err" \
            "${RUNNER_TEMP}/embedded-profile.plist"
          rm -rf \
            "${RUNNER_TEMP}/ParQueen.xcarchive" \
            "${RUNNER_TEMP}/ipa-export" \
            "${RUNNER_TEMP}/ipa-unpacked"
          if [ -e "${RUNNER_TEMP}/AuthKey.p8" ]; then
            echo "AuthKey.p8: STILL PRESENT"
            exit 1
          fi
          echo "AuthKey.p8: ABSENT"
