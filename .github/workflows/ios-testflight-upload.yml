name: iOS TestFlight Upload

# Stage D0. Manual delivery of one verified IPA to App Store Connect.
# Run it from main only, with the confirmation phrase.
# Acceptance means Apple took the binary. It does not submit the app for review.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirmation required to upload on main
        required: true
        type: string

permissions:
  contents: read

# A second manual run waits. Cancelling the active run could cut off an upload already in flight.
concurrency:
  group: parqueen-ios-testflight-upload
  cancel-in-progress: false

jobs:
  dispatch-guard:
    name: dispatch guard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main and confirmation
        env:
          REF_NAME: ${{ github.ref }}
          CONFIRM_TEXT: ${{ github.event.inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${REF_NAME}" = "refs/heads/main" ] && [ "${CONFIRM_TEXT}" = "UPLOAD_PARQUEEN_TESTFLIGHT" ]; then
            echo "dispatch guard: accepted"
            exit 0
          fi
          echo "dispatch guard: rejected"
          exit 1

  contract:
    name: upload contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test get-task-allow classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          def classify_get_task_allow(entitlements):
              if "get-task-allow" not in entitlements:
                  return "pass", "get-task-allow: ABSENT"
              value = entitlements.get("get-task-allow")
              if value is False:
                  return "pass", "get-task-allow: FALSE — DISTRIBUTION SAFE"
              if value is True:
                  return "fail", "get-task-allow: TRUE — FAIL"
              return "fail", "get-task-allow: INVALID — FAIL"

          cases = [
              ({}, "pass"),
              ({"get-task-allow": False}, "pass"),
              ({"get-task-allow": True}, "fail"),
              ({"get-task-allow": "false"}, "fail"),
          ]
          for entitlements, want in cases:
              got, message = classify_get_task_allow(entitlements)
              print(message)
              if got != want:
                  print("get-task-allow classification: FAIL")
                  sys.exit(1)
          print("get-task-allow classification: PASS")
          PY

      - name: Test App Check debug-token classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys

          def classify_debug_wiring(text):
              vite = "VITE_APPCHECK_DEBUG_TOKEN" in text
              assigned = re.search(r"FIREBASE_APPCHECK_DEBUG_TOKEN\s*=(?!=)", text) is not None
              prop = re.search(r"\.FIREBASE_APPCHECK_DEBUG_TOKEN\s*=(?!=)", text) is not None
              bypass = re.search(r"appcheck-debug-", text, re.IGNORECASE) is not None
              return "fail" if (vite or assigned or prop or bypass) else "pass"

          cases = [
              ("", "pass"),
              ("n.resolve(t.FIREBASE_APPCHECK_DEBUG_TOKEN)", "pass"),
              ('typeof t.FIREBASE_APPCHECK_DEBUG_TOKEN == "string"', "pass"),
              ("t.FIREBASE_APPCHECK_DEBUG_TOKEN !== true", "pass"),
              ("VITE_APPCHECK_DEBUG_TOKEN", "fail"),
              ("FIREBASE_APPCHECK_DEBUG_TOKEN=true", "fail"),
              ('self.FIREBASE_APPCHECK_DEBUG_TOKEN="abc"', "fail"),
              ("x.FIREBASE_APPCHECK_DEBUG_TOKEN=n", "fail"),
              ("appcheck-debug-token", "fail"),
          ]
          for sample, want in cases:
              got = classify_debug_wiring(sample)
              if got != want:
                  print("debug-token classification: FAIL")
                  sys.exit(1)
          print("debug-token classification: PASS")
          PY

      - name: Assert workflow security contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(".github/workflows/ios-testflight-upload.yml").read_text().replace("\r\n", "\n")
          secret_ref = "secrets" + "."
          on_block = text.split("\non:\n", 1)[1].split("\npermissions:\n", 1)[0]
          if "workflow_dispatch" not in on_block:
              print("workflow_dispatch trigger is missing")
              sys.exit(1)
          for needle in ("pull_request", "push", "schedule", "workflow_call", "workflow_run", "repository_dispatch"):
              if needle in on_block:
                  print(f"forbidden trigger: {needle}")
                  sys.exit(1)
          if not re.search(r"(?m)^permissions:\n  contents: read\s*$", text):
              print("workflow permissions are not contents read")
              sys.exit(1)
          if ("contents: " + "write") in text or re.search(r"(?m)^[\t ]*[A-Za-z0-9_-]+: write\s*$", text):
              print("workflow requests write permissions")
              sys.exit(1)
          if ("set " + "-x") in text:
              print("workflow enables shell tracing")
              sys.exit(1)
          for label, needle in (
              ("artifact upload", "upload-" + "artifact"),
              ("hosted backend deploy", "firebase " + "deploy"),
              ("continue on error", "continue-on-" + "error"),
          ):
              if needle in text:
                  print(f"forbidden workflow token: {label}")
                  sys.exit(1)
          if re.search(r"(?m)^[\t ]*environment:\s*$", text) or re.search(r"(?m)^[\t ]*strategy:\s*$", text):
              print("workflow uses an environment or a matrix")
              sys.exit(1)

          def checkout_with_blocks(source):
              uses_marker = "actions/" + "checkout@"
              lines = source.splitlines()
              blocks = []
              index = 0
              while index < len(lines):
                  line = lines[index]
                  stripped = line.lstrip(" ")
                  if stripped.startswith("- uses:") and uses_marker in stripped:
                      indent = len(line) - len(stripped)
                      body = []
                      index += 1
                      while index < len(lines):
                          nxt = lines[index]
                          if nxt.strip() == "":
                              look = index + 1
                              while look < len(lines) and lines[look].strip() == "":
                                  look += 1
                              if look >= len(lines):
                                  break
                              look_line = lines[look]
                              look_stripped = look_line.lstrip(" ")
                              look_indent = len(look_line) - len(look_stripped)
                              if look_indent <= indent:
                                  break
                              body.append(nxt)
                              index += 1
                              continue
                          nxt_stripped = nxt.lstrip(" ")
                          nxt_indent = len(nxt) - len(nxt_stripped)
                          if nxt_indent <= indent:
                              break
                          body.append(nxt)
                          index += 1
                      blocks.append(body)
                      continue
                  index += 1
              return blocks

          def with_keys(body):
              collecting = False
              with_indent = None
              keys = []
              for line in body:
                  stripped = line.lstrip(" ")
                  if stripped == "":
                      continue
                  indent = len(line) - len(stripped)
                  if not collecting:
                      if stripped == "with:":
                          collecting = True
                          with_indent = indent
                      continue
                  if indent <= with_indent:
                      break
                  keys.append(stripped)
              return keys

          def classify_checkouts(source, pinned_ref, persist_false):
              blocks = checkout_with_blocks(source)
              if len(blocks) != 2:
                  return "fail"
              persist_prefix = "persist-" + "credentials:"
              for body in blocks:
                  keys = with_keys(body)
                  ref_keys = [key for key in keys if key.startswith("ref:")]
                  persist_keys = [key for key in keys if key.startswith(persist_prefix)]
                  if ref_keys != [pinned_ref] or persist_keys != [persist_false]:
                      return "fail"
              return "pass"

          def checkout_document(step_fields):
              uses = "- uses: " + "actions/" + "checkout@" + "example"
              lines = ["jobs:", "  demo:", "    steps:"]
              for fields in step_fields:
                  lines.append("      " + uses)
                  lines.append("        with:")
                  for field in fields:
                      lines.append("          " + field)
              return "\n".join(lines) + "\n"

          ref_sha = "ref: " + "$" + "{{ " + "github." + "sha }}"
          ref_main = "ref: " + "main"
          persist_false = "persist-" + "credentials: false"
          persist_true = "persist-" + "credentials: true"
          checkout_cases = [
              ("two pinned checkouts", [[ref_sha, persist_false], [ref_sha, persist_false]], "pass"),
              ("missing ref", [[persist_false], [ref_sha, persist_false]], "fail"),
              ("ref main", [[ref_main, persist_false], [ref_sha, persist_false]], "fail"),
              ("missing persist", [[ref_sha], [ref_sha, persist_false]], "fail"),
              ("persist true", [[ref_sha, persist_true], [ref_sha, persist_false]], "fail"),
              ("third checkout", [[ref_sha, persist_false], [ref_sha, persist_false], [ref_sha, persist_false]], "fail"),
          ]
          for case_name, fields, want in checkout_cases:
              got = classify_checkouts(checkout_document(fields), ref_sha, persist_false)
              if got != want:
                  print(f"checkout pin case failed: {case_name}")
                  sys.exit(1)
          decoy = "checker = \"" + ref_sha + "\\n          " + persist_false + "\"\n"
          decoy_doc = decoy + checkout_document([[ref_sha, persist_false], [ref_sha, persist_false]])
          if classify_checkouts(decoy_doc, ref_sha, persist_false) != "pass":
              print("checkout pin case failed: self-match decoy")
              sys.exit(1)
          if classify_checkouts(text, ref_sha, persist_false) != "pass":
              print("checkouts are not pinned to the dispatched commit")
              sys.exit(1)
          print("checkout pin classification: PASS")
          if re.search(r"DEVELOPMENT_TEAM=[A-Z0-9]{10}([^A-Z0-9]|$)", text):
              print("workflow contains a literal Team ID")
              sys.exit(1)
          guard = text.split("\n  dispatch-guard:\n", 1)[1].split("\n  contract:\n", 1)[0]
          if "UPLOAD_PARQUEEN_TESTFLIGHT" not in guard or "refs/heads/main" not in guard:
              print("dispatch guard does not require main and the confirmation phrase")
              sys.exit(1)
          if secret_ref in guard:
              print("dispatch guard references secrets")
              sys.exit(1)
          before_upload = text.split("\n  testflight-upload:\n", 1)[0]
          if secret_ref in before_upload:
              print("secrets are referenced outside the upload job")
              sys.exit(1)
          upload_job = text.split("\n  testflight-upload:\n", 1)[1]
          header = upload_job.split("\n    steps:\n", 1)[0]
          for needle in (
              "github.event_name == 'workflow_dispatch'",
              "github.ref == 'refs/heads/main'",
              "github.event.inputs.confirm == 'UPLOAD_PARQUEEN_TESTFLIGHT'",
              "needs.dispatch-guard.result == 'success'",
              "needs.contract.result == 'success'",
              "runs-on: macos-26",
          ):
              if needle not in header:
                  print(f"upload job guard missing: {needle}")
                  sys.exit(1)

          def step_body(source, title):
              marker = "- name: " + title + "\n"
              start = source.find(marker)
              if start < 0:
                  print(f"missing step: {title}")
                  sys.exit(1)
              rest = source[start + len(marker):]
              nxt = rest.find("\n      - name: ")
              return rest if nxt < 0 else rest[:nxt]

          contract_job = text.split("\n  contract:\n", 1)[1].split("\n  testflight-upload:\n", 1)[0]
          classify_body = step_body(contract_job, "Test get-task-allow classification")
          for needle in (
              '({}, "pass")',
              '({"get-task-allow": False}, "pass")',
              '({"get-task-allow": True}, "fail")',
              '({"get-task-allow": "false"}, "fail")',
          ):
              if needle not in classify_body:
                  print("get-task-allow classification test is incomplete")
                  sys.exit(1)
          if secret_ref in classify_body:
              print("get-task-allow classification test references secrets")
              sys.exit(1)
          debug_body = step_body(contract_job, "Test App Check debug-token classification")
          for needle in (
              '("", "pass")',
              "n.resolve(t.FIREBASE_APPCHECK_DEBUG_TOKEN)",
              'typeof t.FIREBASE_APPCHECK_DEBUG_TOKEN == "string"',
              "t.FIREBASE_APPCHECK_DEBUG_TOKEN !== true",
              '"VITE_APPCHECK_DEBUG_TOKEN", "fail"',
              "FIREBASE_APPCHECK_DEBUG_TOKEN=true",
              'self.FIREBASE_APPCHECK_DEBUG_TOKEN="abc"',
              "x.FIREBASE_APPCHECK_DEBUG_TOKEN=n",
              "appcheck-debug-token",
              "FIREBASE_APPCHECK_DEBUG_TOKEN\\s*=(?!=)",
          ):
              if needle not in debug_body:
                  print("debug-token classification test is incomplete")
                  sys.exit(1)
          if secret_ref in debug_body:
              print("debug-token classification test references secrets")
              sys.exit(1)
          archive_body = step_body(upload_job, "Archive iOS app")
          for needle in (
              "CODE_SIGN_IDENTITY=-",
              "AD_HOC_CODE_SIGNING_ALLOWED=YES",
              "CODE_SIGN_STYLE=Automatic",
              'DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"',
              "-configuration Release",
              "-destination 'generic/platform=iOS'",
              "ParQueen.xcarchive",
          ):
              if needle not in archive_body:
                  print("archive command missing ad-hoc signing setting")
                  sys.exit(1)
          for needle in (
              "-allowProvisioningUpdates",
              "-authenticationKeyPath",
              "-authenticationKeyID",
              "-authenticationKeyIssuerID",
          ):
              if needle in archive_body:
                  print("archive command still requests Apple provisioning")
                  sys.exit(1)
          forced_identity = "CODE_SIGN_IDENTITY=\"" + "Apple " + "Distribution\""
          dev_identity = "CODE_SIGN_IDENTITY=\"" + "iPhone " + "Developer\""
          apple_development = "Apple " + "Development"
          if forced_identity in archive_body or dev_identity in archive_body or apple_development in archive_body:
              print("archive command still forces a provisioning identity")
              sys.exit(1)
          if "PROVISIONING_PROFILE" in archive_body:
              print("archive command sets a provisioning profile")
              sys.exit(1)
          export_body = step_body(upload_job, "Export signed IPA")
          for needle in (
              "-allowProvisioningUpdates",
              "-authenticationKeyPath",
              "-authenticationKeyID",
              "-authenticationKeyIssuerID",
              "app-store-connect",
              "<string>export</string>",
              "manageAppVersionAndBuildNumber",
              "<false/>",
          ):
              if needle not in export_body:
                  print("export command missing distribution authentication")
                  sys.exit(1)
          if "<string>upload</string>" in export_body:
              print("export destination uploads during export")
              sys.exit(1)
          verify_body = step_body(upload_job, "Verify signed IPA")
          for needle in (
              'entitlements.get("get-task-allow")',
              "get-task-allow: ABSENT",
              "get-task-allow: FALSE — DISTRIBUTION SAFE",
              "get-task-allow: TRUE — FAIL",
              "embedded.mobileprovision",
              '"security", "cms", "-D"',
              "application-identifier",
              "com.apple.developer.team-identifier",
              "keychain-access-groups",
              "beta-reports-active",
              "team identifier: MATCH",
              "production web bundle: ABSENT",
              "Mapbox configuration embedded:",
              "App Check production configuration embedded:",
              "Sentry runtime DSN embedded:",
              "VITE App Check debug identifier:",
              "Firebase App Check debug assignment:",
              "known App Check debug bypass marker:",
              "debug App Check token wiring: ABSENT",
              "privacy purpose NSCameraUsageDescription: PASS",
              "privacy purpose NSCameraUsageDescription: FAIL",
              "export compliance ITSAppUsesNonExemptEncryption: FALSE",
              "export compliance ITSAppUsesNonExemptEncryption: FAIL",
              "obsolete camera plugin artifacts: ABSENT",
              "FIREBASE_APPCHECK_DEBUG_TOKEN\\s*=(?!=)",
              "appcheck-debug-",
              "ipa-stamp.txt",
              "CFBundleIdentifier",
              "app.parqueen",
              "CFBundleShortVersionString",
              "CFBundleVersion",
              "CFBundleDisplayName",
              "profile type: distribution",
              "profile valid: YES",
          ):
              if needle not in verify_body:
                  print("ipa verifier is missing a required check")
                  sys.exit(1)
          bare_firebase = '("FIREBASE_APPCHECK_DEBUG_TOKEN" in text)'
          if bare_firebase in verify_body:
              print("ipa verifier still treats a passive Firebase debug identifier as a leak")
              sys.exit(1)
          if "npx vitest run utils/appCheckBundleAssertion.test.ts" not in upload_job:
              print("production App Check bundle assertion is missing")
              sys.exit(1)
          validate_at = upload_job.find("- name: Validate verified IPA\n")
          upload_at = upload_job.find("- name: Upload verified IPA\n")
          cleanup_at = upload_job.find("- name: Delete signing material\n")
          if not (0 <= validate_at < upload_at < cleanup_at):
              print("validation must run after verification and before the single upload")
              sys.exit(1)
          validate_body = step_body(upload_job, "Validate verified IPA")
          upload_body = step_body(upload_job, "Upload verified IPA")
          if validate_body.count("--validate-app") != 1 or "--upload-app" in validate_body:
              print("validation step must call validate once and must not upload")
              sys.exit(1)
          if upload_body.count("--upload-app") != 1 or "--validate-app" in upload_body:
              print("upload step must call upload once")
              sys.exit(1)
          if re.search(r"\bwhile\b", upload_body):
              print("upload step can repeat the transfer")
              sys.exit(1)
          if "UPLOAD STATUS AMBIGUOUS — CHECK APP STORE CONNECT BEFORE RETRY" not in upload_body:
              print("ambiguous upload guard is missing")
              sys.exit(1)
          if "validation-ok" not in validate_body or "validation-ok" not in upload_body:
              print("upload is not bound to the validation result")
              sys.exit(1)
          if "ipa-stamp.txt" not in validate_body or "ipa-stamp.txt" not in upload_body:
              print("upload is not bound to the verified IPA")
              sys.exit(1)
          cleanup_header = upload_job[cleanup_at:cleanup_at + 220]
          cleanup_body = step_body(upload_job, "Delete signing material")
          if "if: always()" not in cleanup_header:
              print("cleanup is not unconditional")
              sys.exit(1)
          for needle in (
              "AuthKey.p8",
              ".appstoreconnect/private_keys",
              "ExportOptions.plist",
              "ipa-export",
              "ipa-unpacked",
              "ParQueen.xcarchive",
              "embedded-profile.plist",
              "validate.log",
              "upload.log",
              "AuthKey.p8: ABSENT",
              "lookup private key: ABSENT",
              "ipa export: ABSENT",
              "xcarchive: ABSENT",
          ):
              if needle not in cleanup_body and needle not in cleanup_header:
                  print(f"cleanup is missing: {needle}")
                  sys.exit(1)
          if "SENTRY_AUTH_TOKEN: \"\"" not in upload_job:
              print("Sentry upload credentials are not forced empty")
              sys.exit(1)
          if secret_ref + "SENTRY_AUTH_TOKEN" in text:
              print("workflow requires a Sentry auth token")
              sys.exit(1)
          if "openssl pkey -in" not in upload_job or "-noout" not in upload_job:
              print("private key validation is missing")
              sys.exit(1)
          if ".appstoreconnect/private_keys" not in upload_job or "--p8-file-path" not in upload_job:
              print("altool private key handling is missing")
              sys.exit(1)
          print("workflow security contract: PASS")
          PY

  testflight-upload:
    name: testflight upload
    needs: [dispatch-guard, contract]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm == 'UPLOAD_PARQUEEN_TESTFLIGHT' &&
      needs.dispatch-guard.result == 'success' &&
      needs.contract.result == 'success'
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: macOS and Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          echo "Selected Xcode version: ${XCODE_VERSION}"
          if ! [[ "${XCODE_MAJOR}" =~ ^[0-9]+$ ]] || [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "::error::Xcode major version '${XCODE_MAJOR}' is below 26."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install npm 10
        run: npm install -g npm@10

      - name: Check required secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID ASC_ISSUER_ID ASC_KEY_ID ASC_API_KEY_P8_BASE64 VITE_MAPBOX_TOKEN VITE_FIREBASE_APPCHECK_SITE_KEY VITE_SENTRY_DSN VITE_FIREBASE_VAPID_KEY; do
            if [ -n "$(printenv "${name}" 2>/dev/null || true)" ]; then
              echo "${name}: PRESENT"
            else
              echo "${name}: MISSING"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::One or more required secrets are missing."
            exit 1
          fi

      - name: Install dependencies and typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          if [ -n "$(git status --short --untracked-files=no)" ]; then
            echo "::error::npm ci or typecheck changed tracked files."
            git status --short --untracked-files=no
            exit 1
          fi

      - name: Build production web assets
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          SENTRY_AUTH_TOKEN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          echo "dist/index.html: PRESENT"

      - name: Assert production App Check bundle
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run utils/appCheckBundleAssertion.test.ts

      - name: Copy web assets into the iOS shell
        shell: bash
        run: |
          set -euo pipefail
          npx cap copy ios
          test -d ios/App/App/public
          test -f ios/App/App/public/index.html
          test -f ios/App/App/capacitor.config.json
          test -f ios/App/App/config.xml
          tracked="$(git status --short --untracked-files=no)"
          if [ -n "${tracked}" ]; then
            echo "::error::cap copy changed tracked files."
            printf '%s\n' "${tracked}"
            exit 1
          fi
          echo "Capacitor iOS inputs: PRESENT"
          echo "tracked mutations: NONE"

      - name: Reconstruct App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, re, sys
          raw = re.sub(r"\s+", "", os.environ.get("ASC_API_KEY_P8_BASE64", ""))
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception:
              print("private key decode: FAIL")
              sys.exit(1)
          if not data.startswith(b"-----BEGIN ") or b"PRIVATE KEY-----" not in data.splitlines()[0]:
              print("private key decode: FAIL")
              sys.exit(1)
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "AuthKey.p8"
          path.write_bytes(data)
          path.chmod(0o600)
          print("private key decode: PASS")
