      - name: Verify signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, re, subprocess, sys
          from datetime import datetime, timezone
          export = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-export"
          ipas = sorted(export.rglob("*.ipa"))
          if len(ipas) != 1:
              print(f"ipa count: {len(ipas)}")
              sys.exit(1)
          ipa = ipas[0]
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          print(f"ipa filename: {ipa.name}")
          print(f"ipa bytes: {ipa.stat().st_size}")
          print(f"ipa sha256: {digest}")
          unpack = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-unpacked"
          unpack.mkdir(parents=True, exist_ok=True)
          subprocess.run(["ditto", "-x", "-k", str(ipa), str(unpack)], check=True)
          apps = [p for p in unpack.rglob("*.app") if p.is_dir()]
          if len(apps) != 1:
              print(f"app bundle count: {len(apps)}")
              sys.exit(1)
          app = apps[0]
          info = plistlib.loads((app / "Info.plist").read_bytes())
          expected = {
              "CFBundleIdentifier": "app.parqueen",
              "CFBundleShortVersionString": "1.0",
              "CFBundleVersion": "3",
              "CFBundleDisplayName": "ParQueen",
          }
          failed = False
          for key, want in expected.items():
              got = info.get(key)
              if got == want:
                  print(f"{key}: PASS")
              else:
                  print(f"{key}: FAIL")
                  failed = True
          camera_purpose = info.get("NSCameraUsageDescription")
          if isinstance(camera_purpose, str) and camera_purpose.strip():
              print("privacy purpose NSCameraUsageDescription: PASS")
          else:
              print("privacy purpose NSCameraUsageDescription: FAIL")
              failed = True
          if info.get("ITSAppUsesNonExemptEncryption") is False:
              print("export compliance ITSAppUsesNonExemptEncryption: FALSE")
          else:
              print("export compliance ITSAppUsesNonExemptEncryption: FAIL")
              failed = True
          for photo_key in ("NSPhotoLibraryUsageDescription", "NSPhotoLibraryAddUsageDescription"):
              if photo_key in info:
                  print(f"privacy purpose {photo_key}: PRESENT")
                  failed = True
              else:
                  print(f"privacy purpose {photo_key}: ABSENT")
          obsolete = []
          for artifact in app.rglob("*"):
              artifact_name = artifact.name
              for token in ("CapacitorCamera", "IONCameraLib"):
                  if artifact_name == token or artifact_name.startswith(token + "."):
                      obsolete.append(str(artifact.relative_to(app)))
                      break
          if obsolete:
              for hit in obsolete:
                  print(f"obsolete camera plugin artifact: {hit}")
              failed = True
          else:
              print("obsolete camera plugin artifacts: ABSENT")
          verify = subprocess.run(["codesign", "--verify", "--deep", "--strict", str(app)], capture_output=True)
          print("codesign verification: PASS" if verify.returncode == 0 else "codesign verification: FAIL")
          if verify.returncode != 0:
              failed = True
          ent = subprocess.run(
              ["codesign", "-d", "--entitlements", ":-", str(app)],
              capture_output=True,
          )
          if ent.returncode != 0 or not ent.stdout.strip():
              print("entitlements: FAIL")
              sys.exit(1)
          entitlements = plistlib.loads(ent.stdout)
          if any("aps-environment" in key for key in entitlements):
              print("aps-environment: PRESENT")
              sys.exit(1)
          print("aps-environment: ABSENT")
          allowed = {
              "application-identifier",
              "com.apple.developer.team-identifier",
              "keychain-access-groups",
              "beta-reports-active",
              "get-task-allow",
          }
          unexpected = sorted(key for key in entitlements if key not in allowed)
          if unexpected:
              for key in unexpected:
                  print(f"unexpected entitlement: {key}")
              sys.exit(1)
          if "get-task-allow" not in entitlements:
              print("get-task-allow: ABSENT")
          else:
              get_task_allow = entitlements.get("get-task-allow")
              if get_task_allow is False:
                  print("get-task-allow: FALSE — DISTRIBUTION SAFE")
              elif get_task_allow is True:
                  print("get-task-allow: TRUE — FAIL")
                  failed = True
              else:
                  print("get-task-allow: INVALID — FAIL")
                  failed = True
          for key in sorted(entitlements):
              print(f"entitlement: {key}")
          team = os.environ["APPLE_TEAM_ID"]
          ident = entitlements.get("application-identifier")
          team_ent = entitlements.get("com.apple.developer.team-identifier")
          if ident == f"{team}.app.parqueen" and team_ent == team:
              print("team identifier: MATCH")
          else:
              print("team identifier: MISMATCH")
              failed = True
          provision = app / "embedded.mobileprovision"
          decoded = pathlib.Path(os.environ["RUNNER_TEMP"]) / "embedded-profile.plist"
          try:
              if not provision.is_file():
                  print("embedded.mobileprovision: ABSENT")
                  failed = True
              else:
                  print("embedded.mobileprovision: PRESENT")
                  decode = subprocess.run(
                      ["security", "cms", "-D", "-i", str(provision), "-o", str(decoded)],
                      capture_output=True,
                  )
                  if decode.returncode != 0 or not decoded.is_file():
                      print("embedded profile decode: FAIL")
                      failed = True
                  else:
                      profile = plistlib.loads(decoded.read_bytes())
                      profile_ent = profile.get("Entitlements")
                      if not isinstance(profile_ent, dict):
                          print("embedded profile entitlements: FAIL")
                          failed = True
                          profile_ent = {}
                      app_id = profile_ent.get("application-identifier")
                      if app_id == f"{team}.app.parqueen":
                          print("profile application identifier: MATCH")
                      else:
                          print("profile application identifier: MISMATCH")
                          failed = True
                      teams = profile.get("TeamIdentifier")
                      if isinstance(teams, list) and team in teams:
                          print("profile team identifier: MATCH")
                      else:
                          print("profile team identifier: MISMATCH")
                          failed = True
                      if "get-task-allow" not in profile_ent:
                          print("profile get-task-allow: ABSENT")
                          failed = True
                      else:
                          profile_task_allow = profile_ent.get("get-task-allow")
                          if profile_task_allow is False:
                              print("profile get-task-allow: FALSE — DISTRIBUTION SAFE")
                          elif profile_task_allow is True:
                              print("profile get-task-allow: TRUE — FAIL")
                              failed = True
                          else:
                              print("profile get-task-allow: INVALID — FAIL")
                              failed = True
                      if "beta-reports-active" not in profile_ent:
                          print("profile beta-reports-active: ABSENT")
                      elif profile_ent.get("beta-reports-active") is True:
                          print("profile beta-reports-active: TRUE")
                      elif profile_ent.get("beta-reports-active") is False:
                          print("profile beta-reports-active: FALSE")
                      else:
                          print("profile beta-reports-active: INVALID")
                          failed = True
                      if "ProvisionedDevices" in profile:
                          print("profile type: development")
                          failed = True
                      else:
                          print("profile type: distribution")
                      expiration = profile.get("ExpirationDate")
                      if not isinstance(expiration, datetime):
                          print("profile expiration: ABSENT")
                          failed = True
                      else:
                          expiry = expiration if expiration.tzinfo else expiration.replace(tzinfo=timezone.utc)
                          print(f"profile expiration: {expiry.date().isoformat()}")
                          if expiry <= datetime.now(timezone.utc):
                              print("profile valid: NO")
                              failed = True
                          else:
                              print("profile valid: YES")
          finally:
              if decoded.exists():
                  decoded.unlink()
          public = app / "public"
          if not public.is_dir() or not (public / "index.html").is_file():
              print("production web bundle: ABSENT")
              sys.exit(1)
          chunks = []
          for path in public.rglob("*"):
              if path.is_file() and path.suffix.lower() in {".js", ".html", ".css", ".json"}:
                  chunks.append(path.read_text(errors="replace"))
          text = "\n".join(chunks)
          mapbox = re.search(r"pk\.[A-Za-z0-9_-]{20,}", text) is not None
          app_check = re.search(r"6L[A-Za-z0-9_-]{20,}", text) is not None
          sentry = re.search(r"https://[A-Za-z0-9]+@[A-Za-z0-9.-]+\.sentry\.io/[0-9]+", text) is not None
          vite_debug = "VITE_APPCHECK_DEBUG_TOKEN" in text
          firebase_assignment = re.search(
              r"FIREBASE_APPCHECK_DEBUG_TOKEN\s*=(?!=)",
              text,
          ) is not None or re.search(
              r"\.FIREBASE_APPCHECK_DEBUG_TOKEN\s*=(?!=)",
              text,
          ) is not None
          bypass = re.search(r"appcheck-debug-", text, re.IGNORECASE) is not None
          print(f"Mapbox configuration embedded: {'YES' if mapbox else 'NO'}")
          print(f"App Check production configuration embedded: {'YES' if app_check else 'NO'}")
          print(f"Sentry runtime DSN embedded: {'YES' if sentry else 'NO'}")
          print("VITE App Check debug identifier: " + ("PRESENT" if vite_debug else "ABSENT"))
          print("Firebase App Check debug assignment: " + ("PRESENT" if firebase_assignment else "ABSENT"))
          print("known App Check debug bypass marker: " + ("PRESENT" if bypass else "ABSENT"))
          if vite_debug or firebase_assignment or bypass:
              failed = True
          else:
              print("debug App Check token wiring: ABSENT")
          if not mapbox or not app_check or not sentry:
              failed = True
          if failed:
              sys.exit(1)
          stamp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-stamp.txt"
          stamp.write_text(str(ipa.resolve()) + "\n" + digest + "\n")
          print("ipa verification: PASS")
          PY

      - name: Inspect altool options
        shell: bash
        run: |
          set -euo pipefail
          HELP="${RUNNER_TEMP}/altool-help.txt"
          set +e
          xcrun altool --help >"${HELP}" 2>&1
          set -e
          python3 - <<'PY'
          import os, pathlib, sys
          help_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "altool-help.txt"
          help_text = help_path.read_text(errors="replace") if help_path.is_file() else ""
          if not help_text.strip():
              print("altool help: EMPTY")
              sys.exit(1)

          def present(flag):
              return flag in help_text

          for flag in (
              "--validate-app",
              "--upload-app",
              "--apiKey",
              "--apiIssuer",
              "--api-key",
              "--api-issuer",
              "--file",
              "-f",
              "--type",
              "--platform",
              "--p8-file-path",
          ):
              print(f"altool option {flag}: {'PRESENT' if present(flag) else 'ABSENT'}")
          if not present("--validate-app") or not present("--upload-app"):
              print("altool help missing validate or upload")
              sys.exit(1)

          def choose(options, label):
              for opt in options:
                  if present(opt):
                      print(f"selected {label}: {opt}")
                      return opt
              print(f"altool help missing {label}")
              sys.exit(1)

          file_flag = choose(["--file", "-f"], "file option")
          type_flag = choose(["--type", "--platform"], "platform option")
          api_key_flag = choose(["--apiKey", "--api-key"], "api key option")
          api_issuer_flag = choose(["--apiIssuer", "--api-issuer"], "api issuer option")
          use_explicit = False
          needle = "--p8-file-path"
          start = 0
          while True:
              idx = help_text.find(needle, start)
              if idx < 0:
                  break
              window = help_text[max(0, idx - 800):idx + 160]
              jwt_only = "generate-jwt" in window or "generate jwt" in window.lower()
              upload_context = "--validate-app" in window or "--upload-app" in window
              if upload_context and not jwt_only:
                  use_explicit = True
                  break
              start = idx + len(needle)
          if use_explicit:
              print("private key path option: --p8-file-path")
              p8_mode = "explicit"
          else:
              print("private key path option: ABSENT")
              print("private key lookup: HOME/.appstoreconnect/private_keys")
              p8_mode = "lookup"
          flags = pathlib.Path(os.environ["RUNNER_TEMP"]) / "altool-flags.txt"
          flags.write_text("\n".join([file_flag, type_flag, api_key_flag, api_issuer_flag, p8_mode]) + "\n")
          PY
          rm -f "${HELP}"

      - name: Install altool private key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          p8_mode="$(sed -n '5p' "${RUNNER_TEMP}/altool-flags.txt")"
          case "${p8_mode}" in
            lookup|explicit) ;;
            *) echo "private key mode: REJECTED"; exit 1 ;;
          esac
          if [ ! -f "${RUNNER_TEMP}/AuthKey.p8" ]; then
            echo "runner private key: ABSENT"
            exit 1
          fi
          mode="$(stat -f '%Lp' "${RUNNER_TEMP}/AuthKey.p8")"
          if [ "${mode}" != "600" ]; then
            echo "runner private key mode: FAIL"
            exit 1
          fi
          if [ "${p8_mode}" != "lookup" ]; then
            echo "altool private key: EXPLICIT PATH"
            exit 0
          fi
          python3 - <<'PY'
          import os, pathlib, re, shutil, sys
          key_id = os.environ.get("ASC_KEY_ID", "")
          if not re.fullmatch(r"[A-Za-z0-9]+", key_id):
              print("altool private key: FAIL")
              sys.exit(1)
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "AuthKey.p8"
          dest_dir = pathlib.Path.home() / ".appstoreconnect" / "private_keys"
          dest_dir.mkdir(parents=True, exist_ok=True)
          dest_dir.chmod(0o700)
          dest = dest_dir / f"AuthKey_{key_id}.p8"
          shutil.copyfile(src, dest)
          dest.chmod(0o600)
          if not dest.is_file() or (dest.stat().st_mode & 0o777) != 0o600:
              print("altool private key mode: FAIL")
              sys.exit(1)
          print("altool private key: INSTALLED")
          print("altool private key mode: 600")
          PY

      - name: Validate verified IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          file_flag="$(sed -n '1p' "${RUNNER_TEMP}/altool-flags.txt")"
          type_flag="$(sed -n '2p' "${RUNNER_TEMP}/altool-flags.txt")"
          api_key_flag="$(sed -n '3p' "${RUNNER_TEMP}/altool-flags.txt")"
          api_issuer_flag="$(sed -n '4p' "${RUNNER_TEMP}/altool-flags.txt")"
          p8_mode="$(sed -n '5p' "${RUNNER_TEMP}/altool-flags.txt")"
          case "${file_flag}" in
            --file|-f) ;;
            *) echo "file option: REJECTED"; exit 1 ;;
          esac
          case "${type_flag}" in
            --type|--platform) ;;
            *) echo "platform option: REJECTED"; exit 1 ;;
          esac
          case "${api_key_flag}" in
            --apiKey|--api-key) ;;
            *) echo "api key option: REJECTED"; exit 1 ;;
          esac
          case "${api_issuer_flag}" in
            --apiIssuer|--api-issuer) ;;
            *) echo "api issuer option: REJECTED"; exit 1 ;;
          esac
          case "${p8_mode}" in
            lookup|explicit) ;;
            *) echo "private key mode: REJECTED"; exit 1 ;;
          esac
          python3 - <<'PY'
          import hashlib, os, pathlib, sys
          stamp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-stamp.txt"
          lines = stamp.read_text().splitlines() if stamp.is_file() else []
          if len(lines) != 2:
              print("ipa stamp: FAIL")
              sys.exit(1)
          ipa = pathlib.Path(lines[0])
          digest = lines[1]
          export = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-export").resolve()
          resolved = ipa.resolve()
          found = sorted(path.resolve() for path in export.rglob("*.ipa"))
          if export not in resolved.parents or resolved.suffix != ".ipa" or found != [resolved]:
              print("verified ipa location: FAIL")
              sys.exit(1)
          got = hashlib.sha256(resolved.read_bytes()).hexdigest()
          if got != digest:
              print("verified ipa hash: MISMATCH")
              sys.exit(1)
          print("verified ipa hash: MATCH")
          pathlib.Path(os.environ["RUNNER_TEMP"], "ipa-path.txt").write_text(str(resolved) + "\n")
          PY
          IPA_PATH="$(tr -d '\r' < "${RUNNER_TEMP}/ipa-path.txt")"
          LOG="${RUNNER_TEMP}/validate.log"
          cmd=(
            xcrun altool
            --validate-app
            "${file_flag}" "${IPA_PATH}"
            "${type_flag}" ios
            "${api_key_flag}" "${ASC_KEY_ID}"
            "${api_issuer_flag}" "${ASC_ISSUER_ID}"
          )
          if [ "${p8_mode}" = "explicit" ]; then
            cmd+=(--p8-file-path "${RUNNER_TEMP}/AuthKey.p8")
          fi
          set +e
          "${cmd[@]}" >"${LOG}" 2>&1
          status=$?
          set -e
          STATUS="${status}" LOG="${LOG}" python3 - <<'PY'
          import os, pathlib, re, sys
          path = pathlib.Path(os.environ["LOG"])
          text = path.read_text(errors="replace")
          for name in ("APPLE_TEAM_ID", "ASC_ISSUER_ID", "ASC_KEY_ID"):
              value = os.environ.get(name) or ""
              if len(value) >= 6:
                  text = text.replace(value, "[REDACTED]")
          text = re.sub(r"AuthKey_[A-Za-z0-9]+", "AuthKey_[REDACTED]", text)
          text = re.sub(r"-----BEGIN [^-]+-----[\s\S]*?-----END [^-]+-----", "[REDACTED_KEY]", text)
          text = re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[REDACTED_EMAIL]", text)
          path.write_text(text)
          status = int(os.environ["STATUS"])
          success = re.search(r"no errors validating|validation succeeded", text, re.I) is not None
          ambiguous = re.search(
              r"timed out|timeout|network connection|connection was lost|connection reset|could not connect|unable to connect|NSURLError|broken pipe|temporarily unavailable|service unavailable|try again later|SSL error|\bHTTP[/ ]50[0234]\b|\bstatus code[: ]+50[0234]\b",
              text,
              re.I,
          ) is not None

          def excerpt(body):
              lines = body.splitlines()
              idx = None
              for i, line in enumerate(lines):
                  if re.search(r"ERROR|error:|failed|Failed", line):
                      idx = i
                      break
              if idx is None:
                  return "\n".join(lines[-40:])
              return "\n".join(lines[max(0, idx - 5):min(len(lines), idx + 16)])

          if status == 0 and success:
              stamp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-stamp.txt"
              digest = stamp.read_text().splitlines()[1]
              pathlib.Path(os.environ["RUNNER_TEMP"], "validation-ok").write_text(digest + "\n")
              print("Apple validation: PASS")
              sys.exit(0)
          if ambiguous or status == 0 or status in (124, 137, 143, 255):
              print("Apple validation: AMBIGUOUS — upload not started")
          else:
              print("Apple validation: FAIL")
          print(excerpt(text))
          sys.exit(1)
          PY

      - name: Upload verified IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "upload attempts authorized: 1"
          file_flag="$(sed -n '1p' "${RUNNER_TEMP}/altool-flags.txt")"
          type_flag="$(sed -n '2p' "${RUNNER_TEMP}/altool-flags.txt")"
          api_key_flag="$(sed -n '3p' "${RUNNER_TEMP}/altool-flags.txt")"
          api_issuer_flag="$(sed -n '4p' "${RUNNER_TEMP}/altool-flags.txt")"
          p8_mode="$(sed -n '5p' "${RUNNER_TEMP}/altool-flags.txt")"
          case "${file_flag}" in
            --file|-f) ;;
            *) echo "file option: REJECTED"; exit 1 ;;
          esac
          case "${type_flag}" in
            --type|--platform) ;;
            *) echo "platform option: REJECTED"; exit 1 ;;
          esac
          case "${api_key_flag}" in
            --apiKey|--api-key) ;;
            *) echo "api key option: REJECTED"; exit 1 ;;
          esac
          case "${api_issuer_flag}" in
            --apiIssuer|--api-issuer) ;;
            *) echo "api issuer option: REJECTED"; exit 1 ;;
          esac
          case "${p8_mode}" in
            lookup|explicit) ;;
            *) echo "private key mode: REJECTED"; exit 1 ;;
          esac
          REQUIRE_VALIDATION=1 python3 - <<'PY'
          import hashlib, os, pathlib, sys
          stamp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-stamp.txt"
          lines = stamp.read_text().splitlines() if stamp.is_file() else []
          if len(lines) != 2:
              print("ipa stamp: FAIL")
              sys.exit(1)
          ipa = pathlib.Path(lines[0])
          digest = lines[1]
          export = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ipa-export").resolve()
          resolved = ipa.resolve()
          found = sorted(path.resolve() for path in export.rglob("*.ipa"))
          if export not in resolved.parents or resolved.suffix != ".ipa" or found != [resolved]:
              print("verified ipa location: FAIL")
              sys.exit(1)
          got = hashlib.sha256(resolved.read_bytes()).hexdigest()
          if got != digest:
              print("verified ipa hash: MISMATCH")
              sys.exit(1)
          print("verified ipa hash: MATCH")
          if os.environ.get("REQUIRE_VALIDATION") == "1":
              marker = pathlib.Path(os.environ["RUNNER_TEMP"]) / "validation-ok"
              if not marker.is_file() or marker.read_text().strip() != digest:
                  print("Apple validation marker: ABSENT")
                  sys.exit(1)
              print("Apple validation marker: MATCH")
          pathlib.Path(os.environ["RUNNER_TEMP"], "ipa-path.txt").write_text(str(resolved) + "\n")
          PY
          IPA_PATH="$(tr -d '\r' < "${RUNNER_TEMP}/ipa-path.txt")"
          LOG="${RUNNER_TEMP}/upload.log"
          cmd=(
            xcrun altool
            --upload-app
            "${file_flag}" "${IPA_PATH}"
            "${type_flag}" ios
            "${api_key_flag}" "${ASC_KEY_ID}"
            "${api_issuer_flag}" "${ASC_ISSUER_ID}"
          )
          if [ "${p8_mode}" = "explicit" ]; then
            cmd+=(--p8-file-path "${RUNNER_TEMP}/AuthKey.p8")
          fi
          trap 'echo "UPLOAD STATUS AMBIGUOUS — CHECK APP STORE CONNECT BEFORE RETRY"; exit 1' TERM INT
          set +e
          "${cmd[@]}" >"${LOG}" 2>&1
          status=$?
          set -e
          trap - TERM INT
          STATUS="${status}" LOG="${LOG}" python3 - <<'PY'
          import os, pathlib, re, sys
          path = pathlib.Path(os.environ["LOG"])
          text = path.read_text(errors="replace")
          for name in ("APPLE_TEAM_ID", "ASC_ISSUER_ID", "ASC_KEY_ID"):
              value = os.environ.get(name) or ""
              if len(value) >= 6:
                  text = text.replace(value, "[REDACTED]")
          text = re.sub(r"AuthKey_[A-Za-z0-9]+", "AuthKey_[REDACTED]", text)
          text = re.sub(r"-----BEGIN [^-]+-----[\s\S]*?-----END [^-]+-----", "[REDACTED_KEY]", text)
          text = re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[REDACTED_EMAIL]", text)
          path.write_text(text)
          status = int(os.environ["STATUS"])
          success = re.search(r"no errors uploading|upload succeeded|uploaded successfully", text, re.I) is not None
          ambiguous = re.search(
              r"timed out|timeout|network connection|connection was lost|connection reset|could not connect|unable to connect|NSURLError|broken pipe|temporarily unavailable|service unavailable|try again later|SSL error|\bHTTP[/ ]50[0234]\b|\bstatus code[: ]+50[0234]\b",
              text,
              re.I,
          ) is not None
          delivery = re.search(
              r"(?i)\b(?:delivery uuid|delivery id|request id)\b\s*[:=]\s*([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})",
              text,
          )

          def excerpt(body):
              lines = body.splitlines()
              idx = None
              for i, line in enumerate(lines):
                  if re.search(r"ERROR|error:|failed|Failed", line):
                      idx = i
                      break
              if idx is None:
                  return "\n".join(lines[-40:])
              return "\n".join(lines[max(0, idx - 5):min(len(lines), idx + 16)])

          def report(line, extra=None):
              print(line)
              if extra:
                  print(extra)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(line + "\n")
                      if extra:
                          handle.write(extra + "\n")

          if status == 0 and success:
              extra = f"delivery id: {delivery.group(1)}" if delivery else None
              report("UPLOAD ACCEPTED", extra)
              print("Apple accepted the binary delivery.")
              sys.exit(0)
          if ambiguous or status == 0 or status in (124, 137, 143, 255) or success:
              report("UPLOAD STATUS AMBIGUOUS — CHECK APP STORE CONNECT BEFORE RETRY")
          else:
              report("UPLOAD FAILED")
          print(excerpt(text))
          sys.exit(1)
          PY

      - name: Delete signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "${RUNNER_TEMP}/AuthKey.p8" \
            "${RUNNER_TEMP}/ExportOptions.plist" \
            "${RUNNER_TEMP}/archive.log" \
            "${RUNNER_TEMP}/export.log" \
            "${RUNNER_TEMP}/validate.log" \
            "${RUNNER_TEMP}/upload.log" \
            "${RUNNER_TEMP}/altool-help.txt" \
            "${RUNNER_TEMP}/altool-flags.txt" \
            "${RUNNER_TEMP}/ipa-stamp.txt" \
            "${RUNNER_TEMP}/ipa-path.txt" \
            "${RUNNER_TEMP}/validation-ok" \
            "${RUNNER_TEMP}/pkey.err" \
            "${RUNNER_TEMP}/embedded-profile.plist"
          rm -rf \
            "${RUNNER_TEMP}/ParQueen.xcarchive" \
            "${RUNNER_TEMP}/ipa-export" \
            "${RUNNER_TEMP}/ipa-unpacked"
          python3 - <<'PY'
          import os, pathlib, re, sys
          base = pathlib.Path.home() / ".appstoreconnect" / "private_keys"
          key_id = os.environ.get("ASC_KEY_ID", "")
          if re.fullmatch(r"[A-Za-z0-9]+", key_id):
              dest = base / f"AuthKey_{key_id}.p8"
              if dest.exists():
                  dest.unlink()
              if dest.exists():
                  print("lookup private key: STILL PRESENT")
                  sys.exit(1)
          elif base.is_dir() and any(base.glob("AuthKey_*.p8")):
              print("lookup private key: STILL PRESENT")
              sys.exit(1)
          print("lookup private key: ABSENT")
          PY
          rmdir "${HOME}/.appstoreconnect/private_keys" 2>/dev/null || true
          rmdir "${HOME}/.appstoreconnect" 2>/dev/null || true
          if [ -e "${RUNNER_TEMP}/AuthKey.p8" ]; then
            echo "AuthKey.p8: STILL PRESENT"
            exit 1
          fi
          echo "AuthKey.p8: ABSENT"
          if [ -e "${RUNNER_TEMP}/ipa-export" ]; then
            echo "ipa export: STILL PRESENT"
            exit 1
          fi
          echo "ipa export: ABSENT"
          if [ -e "${RUNNER_TEMP}/ParQueen.xcarchive" ]; then
            echo "xcarchive: STILL PRESENT"
            exit 1
          fi
          echo "xcarchive: ABSENT"
