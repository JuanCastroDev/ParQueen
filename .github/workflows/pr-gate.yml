name: PR Gate

# Always-present, always-required gate for PRs into main. Existing
# path-filtered workflows (Avatar Pipeline, Unit Tests, Firestore Security
# Rules) cannot safely be required directly — GitHub shows a path-filtered
# required check as permanently "Expected" on any PR whose diff doesn't
# happen to match that workflow's paths filter, deadlocking the merge. This
# workflow always runs and always reports the same stable check
# (`PR Gate / gate`), internally routing to whichever suites the PR's full
# diff actually touches.
#
# Secret scan remains a separate, independently-required workflow — already
# unconditional on every push/PR, not folded in here.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Classifies the FULL pull-request diff (base...head, not just the
      # latest commit — see PR #69 for why single-commit diffing is wrong)
      # into which existing suites are relevant. Native git only — no
      # third-party path-filter Action. Any detection failure fails CLOSED
      # (runs every category), never silently skips.
      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -uo pipefail

          run_client=false
          run_functions=false
          run_firestore=false
          run_storage=false
          mode="diff"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="workflow_dispatch"
            run_client=true
            run_functions=true
            run_firestore=true
            run_storage=true
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            set +e
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null)"
            DIFF_STATUS=$?
            set -e

            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || [ "$DIFF_STATUS" -ne 0 ] || [ -z "$CHANGED_FILES" ]; then
              echo "::warning::Changed-file classification could not be determined reliably (base=$BASE_SHA head=$HEAD_SHA status=$DIFF_STATUS) — failing closed and running every category."
              mode="fail-closed"
              run_client=true
              run_functions=true
              run_firestore=true
              run_storage=true
            else
              mode="diff ($BASE_SHA...$HEAD_SHA)"
              echo "Changed files:"
              echo "$CHANGED_FILES"

              # SHARED — anything capable of affecting every environment.
              if echo "$CHANGED_FILES" | grep -qE '^(package\.json|package-lock\.json)$|^\.github/workflows/'; then
                run_client=true
                run_functions=true
                run_firestore=true
                run_storage=true
              fi

              # firebase.json / .firebaserc affect every Firebase-emulator-driven
              # suite (Functions, Firestore, Storage) but not the plain client
              # vitest suite, which never reads them.
              if echo "$CHANGED_FILES" | grep -qE '^(firebase\.json|\.firebaserc)$'; then
                run_functions=true
                run_firestore=true
                run_storage=true
              fi

              # CLIENT
              if echo "$CHANGED_FILES" | grep -qE '^(views/|components/|hooks/|services/|utils/|i18n/)|^(App\.tsx|ErrorBoundary\.tsx|index\.tsx|database\.ts|types\.ts|firebase\.ts|firebaseConfig\.ts|vite\.config\.ts|assets\.d\.ts)$'; then
                run_client=true
              fi

              # FUNCTIONS — functions/** is a full wildcard on purpose: the
              # prior hand-curated allowlist (Avatar Pipeline) missed a brand
              # new Functions integration test file because it wasn't on the
              # list. Any new file under functions/** must always qualify.
              if echo "$CHANGED_FILES" | grep -qE '^functions/|^vite\.functions\.config\.ts$'; then
                run_functions=true
              fi

              # FIRESTORE
              if echo "$CHANGED_FILES" | grep -qE '^(firestore\.rules|firestore\.rules\.test\.ts|firestore\.indexes\.json|vite\.rules\.config\.ts)$'; then
                run_firestore=true
              fi

              # STORAGE — closes the existing gap where test:storage:rules
              # exists in package.json but no workflow has ever run it.
              if echo "$CHANGED_FILES" | grep -qE '^(storage\.rules|storage\.rules\.test\.ts|vite\.storage-rules\.config\.ts)$'; then
                run_storage=true
              fi
            fi
          fi

          {
            echo "run_client=$run_client"
            echo "run_functions=$run_functions"
            echo "run_firestore=$run_firestore"
            echo "run_storage=$run_storage"
          } >> "$GITHUB_OUTPUT"

          summary() {
            local label="$1" val="$2"
            if [ "$val" = true ]; then echo "$label: RUN"; else echo "$label: SKIP"; fi
          }

          {
            echo "### PR Gate classification — $mode"
            echo '```'
            summary "CLIENT" "$run_client"
            summary "FUNCTIONS" "$run_functions"
            summary "FIRESTORE" "$run_firestore"
            summary "STORAGE" "$run_storage"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/setup-node/git/ref/tags/v4 --jq .object.sha
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.classify.outputs.run_client == 'true' || steps.classify.outputs.run_functions == 'true' || steps.classify.outputs.run_firestore == 'true' || steps.classify.outputs.run_storage == 'true'
        with:
          node-version: 22

      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/setup-java/git/ref/tags/v4 --jq .object.sha
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        if: steps.classify.outputs.run_functions == 'true' || steps.classify.outputs.run_firestore == 'true' || steps.classify.outputs.run_storage == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install root dependencies
        if: steps.classify.outputs.run_client == 'true' || steps.classify.outputs.run_functions == 'true' || steps.classify.outputs.run_firestore == 'true' || steps.classify.outputs.run_storage == 'true'
        run: npm ci

      # ── CLIENT ──────────────────────────────────────────────────────────
      # The root vitest suite globs in functions/*.test.js, and two of those —
      # nycBorough.test.js and overpassJson.test.js — require functions/index.js,
      # which pulls in firebase-functions. Those packages live in
      # functions/node_modules, so they must be installed from the Functions
      # lockfile before any root test run or the suite fails with
      # "Cannot find module 'firebase-functions/v2/scheduler'".
      - name: CLIENT — Install functions dependencies
        if: steps.classify.outputs.run_client == 'true'
        run: npm ci --prefix functions

      - name: CLIENT — Run unit tests
        if: steps.classify.outputs.run_client == 'true'
        run: npm test

      - name: CLIENT — Typecheck
        if: steps.classify.outputs.run_client == 'true'
        run: npx tsc --noEmit

      - name: CLIENT — Production build
        if: steps.classify.outputs.run_client == 'true'
        run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}

      # ── FUNCTIONS ───────────────────────────────────────────────────────
      # npm 10 for cross-platform lockfile compatibility (consistent with
      # avatar-pipeline.yml — only needed for the functions/ install below).
      - name: FUNCTIONS — Install npm 10
        if: steps.classify.outputs.run_functions == 'true'
        run: npm install -g npm@10

      - name: FUNCTIONS — Install functions dependencies (Linux, npm 10)
        if: steps.classify.outputs.run_functions == 'true'
        run: npm ci --prefix functions --include=optional

      - name: FUNCTIONS — Verify Sharp and libvips versions
        if: steps.classify.outputs.run_functions == 'true'
        run: |
          node -e "
            const sharp = require('./functions/node_modules/sharp');
            const v = sharp.versions;
            console.log('sharp: ' + v.sharp + '  vips: ' + v.vips);
            function semverGte(actual, min) {
              const [a0,a1,a2] = actual.split('.').map(Number);
              const [m0,m1,m2] = min.split('.').map(Number);
              if (a0 !== m0) return a0 > m0;
              if (a1 !== m1) return a1 > m1;
              return a2 >= m2;
            }
            if (!semverGte(v.sharp, '0.35.3')) throw new Error('sharp too old: ' + v.sharp);
            if (!semverGte(v.vips,  '8.18.3')) throw new Error('vips too old: '  + v.vips);
            console.log('Version check PASS');
          "

      - name: FUNCTIONS — Sharp Linux smoke test
        if: steps.classify.outputs.run_functions == 'true'
        run: |
          node -e "
            const sharp = require('./functions/node_modules/sharp');
            sharp({ create: { width: 32, height: 32, channels: 3, background: { r:200,g:80,b:80 } } })
              .withMetadata({ orientation: 6 })
              .jpeg({ quality: 80 })
              .toBuffer()
              .then(jpegWithExif => sharp(jpegWithExif).metadata().then(m => {
                if (!m.exif) throw new Error('fixture should have EXIF');
                return jpegWithExif;
              }))
              .then(buf => sharp(buf, { failOn:'warning', limitInputPixels:16777216, limitInputChannels:4 })
                .resize({ width:512, height:512, fit:'inside', withoutEnlargement:true })
                .webp({ quality: 80 })
                .toBuffer())
              .then(webp => sharp(webp).metadata())
              .then(m => {
                if (m.format !== 'webp')       throw new Error('Expected webp, got ' + m.format);
                if (m.width > 512)             throw new Error('Width too large: ' + m.width);
                if (m.exif !== undefined)      throw new Error('EXIF should be absent after re-encode');
                if (m.xmp  !== undefined)      throw new Error('XMP should be absent');
                if (m.iptc !== undefined)      throw new Error('IPTC should be absent');
                console.log('Smoke test PASS — format:', m.format, 'size:', m.width + 'x' + m.height, 'exif: none');
              });
          "

      - name: Install Firebase CLI
        if: steps.classify.outputs.run_functions == 'true' || steps.classify.outputs.run_firestore == 'true' || steps.classify.outputs.run_storage == 'true'
        run: npm install -g firebase-tools@15.24.0

      - name: FUNCTIONS — Run Functions integration tests (Linux)
        if: steps.classify.outputs.run_functions == 'true'
        run: npm run test:functions
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # ── FIRESTORE ───────────────────────────────────────────────────────
      - name: FIRESTORE — Run Firestore rules tests
        if: steps.classify.outputs.run_firestore == 'true'
        run: npm run test:rules
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # ── STORAGE ─────────────────────────────────────────────────────────
      - name: STORAGE — Run Storage rules tests
        if: steps.classify.outputs.run_storage == 'true'
        run: npm run test:storage:rules

      - name: Nothing applicable
        if: steps.classify.outputs.run_client == 'false' && steps.classify.outputs.run_functions == 'false' && steps.classify.outputs.run_firestore == 'false' && steps.classify.outputs.run_storage == 'false'
        run: echo "No CLIENT/FUNCTIONS/FIRESTORE/STORAGE-relevant paths changed — gate passes with nothing to verify."
