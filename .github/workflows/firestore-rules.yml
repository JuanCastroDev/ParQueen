name: Firestore Security Rules

on:
  push:
    paths:
      - firestore.rules
      - firestore.rules.test.ts
      - firestore.rules.test.candidate-aware.ts
      - firestore.rules.test.original-suite.ts
      - firestore.rules.finder-notice.31ag.test.ts
      - firestore.rules.ping-delete.test.ts
      - firestore.indexes.json
      - firebase.json
      - .firebaserc
      - package.json
      - package-lock.json
      - vite.rules.config.ts
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firestore.rules.test.ts
      - firestore.rules.test.candidate-aware.ts
      - firestore.rules.test.original-suite.ts
      - firestore.rules.finder-notice.31ag.test.ts
      - firestore.rules.ping-delete.test.ts
      - firestore.indexes.json
      - firebase.json
      - .firebaserc
      - package.json
      - package-lock.json
      - vite.rules.config.ts
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-test:
    name: Run Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/setup-node/git/ref/tags/v4 --jq .object.sha
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/setup-java/git/ref/tags/v4 --jq .object.sha
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Run Firestore rules tests
        run: npm run test:rules
        env:
          # demo-* project IDs require no real credentials
          FIREBASE_CLI_EXPERIMENTS: webframeworks
