name: Avatar Pipeline (Linux / Sharp)

on:
  push:
    paths:
      - functions/package.json
      - functions/package-lock.json
      - functions/index.js
      - functions/.env.parkqueen-46475363-ccf36
      - functions/moderateAvatarUpload.integration.test.js
      - functions/rateLimitCallable.integration.test.js
      - functions/bootstrapAdmin.integration.test.js
      - storage.rules
      - storage.rules.test.ts
      - vite.functions.config.ts
      - .github/scripts/probe-functions-index-load.js
      - .github/workflows/avatar-pipeline.yml
  pull_request:
    paths:
      - functions/package.json
      - functions/package-lock.json
      - functions/index.js
      - functions/.env.parkqueen-46475363-ccf36
      - functions/moderateAvatarUpload.integration.test.js
      - functions/rateLimitCallable.integration.test.js
      - functions/bootstrapAdmin.integration.test.js
      - storage.rules
      - storage.rules.test.ts
      - vite.functions.config.ts
      - .github/scripts/probe-functions-index-load.js
      - .github/workflows/avatar-pipeline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sharp-linux:
    name: Sharp Linux verification and Functions integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/checkout/git/ref/tags/v4.2.2 --jq .object.sha
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/setup-node/git/ref/tags/v4 --jq .object.sha
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/setup-java/git/ref/tags/v4 --jq .object.sha
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      # npm 10 for cross-platform lockfile compatibility (consistent with firestore-rules.yml).
      - name: Install npm 10
        run: npm install -g npm@10

      # Install functions dependencies on Linux — validates the lockfile includes
      # linux-x64 libvips and all other platform-specific optional packages.
      - name: Install functions dependencies (Linux, npm 10)
        run: npm ci --prefix functions --include=optional

      # Verify Sharp >= 0.35.3 and libvips >= 8.18.3 on Linux.
      - name: Verify Sharp and libvips versions
        run: |
          node -e "
            const sharp = require('./functions/node_modules/sharp');
            const v = sharp.versions;
            console.log('sharp: ' + v.sharp + '  vips: ' + v.vips);
            function semverGte(actual, min) {
              const [a0,a1,a2] = actual.split('.').map(Number);
              const [m0,m1,m2] = min.split('.').map(Number);
              if (a0 !== m0) return a0 > m0;
              if (a1 !== m1) return a1 > m1;
              return a2 >= m2;
            }
            if (!semverGte(v.sharp, '0.35.3')) throw new Error('sharp too old: ' + v.sharp);
            if (!semverGte(v.vips,  '8.18.3')) throw new Error('vips too old: '  + v.vips);
            console.log('Version check PASS');
          "

      # Real Sharp Linux smoke test: create PNG -> resize -> encode WebP -> inspect.
      - name: Sharp Linux smoke test
        run: |
          node -e "
            const sharp = require('./functions/node_modules/sharp');
            sharp({ create: { width: 32, height: 32, channels: 3, background: { r:200,g:80,b:80 } } })
              .withMetadata({ orientation: 6 })
              .jpeg({ quality: 80 })
              .toBuffer()
              .then(jpegWithExif => sharp(jpegWithExif).metadata().then(m => {
                if (!m.exif) throw new Error('fixture should have EXIF');
                return jpegWithExif;
              }))
              .then(buf => sharp(buf, { failOn:'warning', limitInputPixels:16777216, limitInputChannels:4 })
                .resize({ width:512, height:512, fit:'inside', withoutEnlargement:true })
                .webp({ quality: 80 })
                .toBuffer())
              .then(webp => sharp(webp).metadata())
              .then(m => {
                if (m.format !== 'webp')       throw new Error('Expected webp, got ' + m.format);
                if (m.width > 512)             throw new Error('Width too large: ' + m.width);
                if (m.exif !== undefined)      throw new Error('EXIF should be absent after re-encode');
                if (m.xmp  !== undefined)      throw new Error('XMP should be absent');
                if (m.iptc !== undefined)      throw new Error('IPTC should be absent');
                console.log('Smoke test PASS — format:', m.format, 'size:', m.width + 'x' + m.height, 'exif: none');
              });
          "

      # Install root dependencies (Firebase CLI, vitest, emulator tooling).
      - name: Install root dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      # TM-16: SHA-pinned. Verify with:
      #   gh api repos/actions/cache/git/ref/tags/v4.2.4 --jq .object.sha
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      # Fail fast if functions/index.js cannot finish loading. A hang here is
      # distinct from Firebase emulator discovery, which historically stalled
      # this job after "Serving at port" with no vitest output.
      - name: Probe functions/index.js load
        run: |
          set -uo pipefail
          if timeout --signal=KILL 120 node .github/scripts/probe-functions-index-load.js; then
            exit 0
          fi
          status=$?
          echo "FUNCTIONS_INDEX_LOAD_HANG"
          echo "functions/index.js require did not finish within 120s (exit ${status})"
          exit 1
        env:
          FIREBASE_CONFIG: '{"projectId":"demo-parkqueen","storageBucket":"demo-parkqueen.appspot.com"}'
          GCLOUD_PROJECT: demo-parkqueen
          FUNCTIONS_EMULATOR: 'true'

      # Run the full Functions integration suite on ubuntu-latest.
      # firebase emulators:exec starts all required emulators, runs vitest, then stops them.
      - name: Run Functions integration tests (Linux)
        run: |
          echo "FUNCTIONS_EMULATOR_EXEC_START"
          npm run test:functions
          echo "FUNCTIONS_EMULATOR_EXEC_DONE"
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # firebase-debug.log is present when the CLI writes one; firestore-debug.log
      # is created by the Firestore emulator. Upload neither unless the suite failed.
      - name: Upload emulator debug logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avatar-functions-emulator-logs
          if-no-files-found: ignore
          path: |
            firebase-debug.log
            firestore-debug.log
